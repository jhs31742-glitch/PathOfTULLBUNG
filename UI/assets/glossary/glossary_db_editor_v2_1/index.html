    <button id="applyOrder" type="button">현재 정렬을 order에 적용</button><small id="sortHelp" aria-live="polite"></small>
  </div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x)), rule=/^[a-z][a-z0-9_-]{0,63}$/;
const collate=(a,b)=>String(a).localeCompare(String(b),'ko');
const schemaKeys=['id','category','order','name','summary','description','tags','relatedIds'];
const state={doc:null,selected:null,search:'',filter:'',sort:'manual',listMode:'game',preview:false,undo:[],redo:[],editKey:null,baseline:'',source:'내장 초기 DB',drag:null};
function current(){return state.doc?.entries.find(e=>e.id===state.selected)||null}
function fingerprint(doc){return JSON.stringify(doc)}
function isDirty(){return !!state.doc&&fingerprint(state.doc)!==state.baseline}
function notice(msg,kind=''){const f=$('feedback');f.textContent=msg;f.className=kind}
function uniqueId(base){let root=String(base).toLowerCase().replace(/[^a-z0-9_-]/g,'_').replace(/^[^a-z]+/,'').slice(0,52)||'term';const all=new Set(state.doc.entries.map(x=>x.id));let id=root,n=2;while(all.has(id))id=`${root}_${n++}`;return id}
function validate(doc){const errs=[];if(!doc||doc.schemaVersion!==1||!Array.isArray(doc.entries)){return ['schemaVersion 1 및 entries 배열이 필요합니다.']}if(doc.entries.length>500)errs.push('항목 최대 500개를 초과했습니다.');const seen=new Set();doc.entries.forEach((e,i)=>{const tag=`${i+1}번`;if(!e||typeof e!=='object'||Array.isArray(e)){errs.push(`${tag}: 객체가 아닙니다.`);return}if(typeof e.id!=='string'||!rule.test(e.id))errs.push(`${tag}: ID 형식 오류`);else if(seen.has(e.id))errs.push(`${tag}: ID 중복 (${e.id})`);seen.add(e.id);if(typeof e.name!=='string'||!e.name.trim())errs.push(`${tag}: 용어명 필수`);if(typeof e.category!=='string'||!e.category.trim())errs.push(`${tag}: 분류 필수`);if(typeof e.summary!=='string')errs.push(`${tag}: 요약 문자열 필수`);if(!Number.isInteger(e.order))errs.push(`${tag}: order 정수 필수`);for(const key of ['description','tags','relatedIds'])if(!Array.isArray(e[key])||!e[key].every(v=>typeof v==='string'))errs.push(`${tag}: ${key} 문자열 배열 필수`)});doc.entries.forEach(e=>{if(e&&Array.isArray(e.relatedIds))for(const id of e.relatedIds)if(!seen.has(id))errs.push(`${e.id}: 관련 ID ${id} 없음`)});return errs}
function compareStored(a,b){return a.order-b.order||collate(a.name,b.name)||collate(a.id,b.id)}
function sortedFull(){const all=[...state.doc.entries];const c=(a,b)=>collate(a.name,b.name)||collate(a.id,b.id);switch(state.sort){case 'nameAsc':all.sort(c);break;case 'nameDesc':all.sort((a,b)=>-c(a,b));break;case 'categoryAsc':all.sort((a,b)=>collate(a.category,b.category)||c(a,b));break;case 'categoryDesc':all.sort((a,b)=>-collate(a.category,b.category)||c(a,b));break;case 'tagAsc':all.sort((a,b)=>collate([...a.tags].sort(collate)[0]||'\uffff',[...b.tags].sort(collate)[0]||'\uffff')||c(a,b));break;case 'tagDesc':all.sort((a,b)=>-collate([...a.tags].sort(collate)[0]||'\uffff',[...b.tags].sort(collate)[0]||'\uffff')||c(a,b));break;default:all.sort(compareStored)}return all}
function visible(){const q=state.search.toLocaleLowerCase().trim();const pool=state.listMode==='game'?[...state.doc.entries].sort(compareStored):sortedFull();return pool.filter(e=>(!state.filter||e.category===state.filter)&&(!q||[e.name,e.id,e.category,e.summary,...e.tags].some(x=>String(x).toLocaleLowerCase().includes(q))))}
// Mirrors the production renderer: sort by order, collect categories by first occurrence,
// then show each category's terms in their sorted relative order.
function gameGrouped(rows){const groups=new Map();for(const e of rows){if(!groups.has(e.category))groups.set(e.category,[]);groups.get(e.category).push(e)}return [...groups.entries()]}
function editingOrder(){return state.listMode==='work'&&state.sort==='manual'&&!state.search.trim()&&!state.filter&&!state.preview}
function checkpoint(key=null){if(key&&state.editKey===key)return;state.undo.push(clone(state.doc));if(state.undo.length>100)state.undo.shift();state.redo=[];state.editKey=key;updateStatus()}
function resetEdit(){state.editKey=null}
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=String(txt);return x}
function btn(label,cb,cls=''){const x=el('button',cls,label);x.type='button';x.addEventListener('click',cb);return x}
function setSelected(id){state.selected=id;resetEdit();drawList();drawCenter();drawInspector();updateStatus()}
function choose(id){state.search='';state.filter='';$('search').value='';$('categoryFilter').value='';state.sort='manual';$('sortMode').value='manual';setSelected(id)}
function drawFilters(){const previous=state.filter,sel=$('categoryFilter');sel.replaceChildren();sel.append(new Option('모든 분류',''));const categories=[...new Set(state.doc.entries.map(e=>e.category))].sort(collate);categories.forEach(v=>sel.append(new Option(v,v)));if(categories.includes(previous))sel.value=previous;else state.filter=''}
function canApply(){return !state.search.trim()&&!state.filter&&!state.preview}
function drawSortHelp(){const work=state.listMode==='work';$('gameView').classList.toggle('active',!work);$('workView').classList.toggle('active',work);$('applyOrder').disabled=!canApply()||state.doc.entries.length===0;$('sortHelp').textContent=state.search.trim()||state.filter?'필터를 해제해야 전체 DB 순서를 변경할 수 있습니다.':state.listMode==='game'?'현재 저장된 order를 기준으로 게임과 동일하게 분류별로 묶어 표시합니다. 정렬을 선택하면 순서 편집으로 전환됩니다.':state.sort==='manual'?'손잡이(⠿)를 드래그하거나 ↑↓로 order를 변경할 수 있습니다.':'정렬을 확정하면 order가 10, 20, 30…으로 갱신됩니다.';$('sortHelp').title=$('sortHelp').textContent}
function drawList(){drawSortHelp();const host=$('entryList');host.replaceChildren();const rows=visible();$('count').textContent=`${rows.length}/${state.doc.entries.length}`;const grouped=state.listMode==='game';const groups=grouped?gameGrouped(rows):[['',rows]];if(!rows.length){host.append(el('div','empty','일치하는 용어가 없습니다.'));return}for(const [category,items] of groups){if(grouped)host.append(el('div','category-title',category));for(const e of items){const row=el('div','entryrow'+(e.id===state.selected?' selected':''));row.dataset.id=e.id;const select=btn(e.name,()=>setSelected(e.id),'entryselect');select.replaceChildren();select.append(el('strong','',e.name||'(이름 없음)'));if(!grouped)select.append(el('small','',`${e.category} · order ${e.order}`));row.append(select);if(editingOrder()){
const grip=btn('⠿',()=>{},'grip');grip.title='드래그하여 순서 변경';grip.draggable=true;grip.setAttribute('aria-label',`${e.name} 순서 드래그`);
grip.addEventListener('dragstart',ev=>{state.drag=e.id;row.classList.add('dragging');ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',e.id)});
grip.addEventListener('dragend',()=>{state.drag=null;clearDragStyles()});
row.addEventListener('dragover',ev=>{if(!state.drag||state.drag===e.id)return;ev.preventDefault();clearDragStyles();const rect=row.getBoundingClientRect();row.classList.add(ev.clientY>rect.top+rect.height/2?'dragover-after':'dragover')});

row.addEventListener('drop',ev=>{if(!state.drag||state.drag===e.id)return;ev.preventDefault();const rect=row.getBoundingClientRect();reorder(state.drag,e.id,ev.clientY>rect.top+rect.height/2)});
row.append(grip);const buttons=el('div','dragbuttons');const at=rows.findIndex(x=>x.id===e.id);const up=btn('▲',()=>shiftOrder(e.id,-1));up.title='한 칸 위로';up.disabled=at===0;const down=btn('▼',()=>shiftOrder(e.id,1));down.title='한 칸 아래로';down.disabled=at===rows.length-1;buttons.append(up,down);row.append(buttons)}host.append(row)}}}
function clearDragStyles(){for(const row of $('entryList').querySelectorAll('.entryrow'))row.classList.remove('dragging','dragover','dragover-after')}
function normalizeOrder(list){for(let i=0;i<list.length;i++)list[i].order=(i+1)*10;state.doc.entries=[...list]}
function reorder(moving,target,after){if(!editingOrder())return;state.drag=null;const rows=sortedFull(),from=rows.findIndex(e=>e.id===moving),to=rows.findIndex(e=>e.id===target);if(from<0||to<0||from===to)return;const item=rows.splice(from,1)[0];let dest=rows.findIndex(e=>e.id===target);if(after)dest++;rows.splice(dest,0,item);checkpoint();normalizeOrder(rows);resetEdit();drawList();updateStatus();notice('드래그 순서를 order에 반영했습니다.','ok')}
function shiftOrder(id,delta){if(!editingOrder())return;const rows=sortedFull(),at=rows.findIndex(e=>e.id===id),other=at+delta;if(at<0||other<0||other>=rows.length)return;[rows[at],rows[other]]=[rows[other],rows[at]];checkpoint();normalizeOrder(rows);resetEdit();drawList();updateStatus();notice('이동 순서를 order에 반영했습니다.','ok')}
function applyOrder(){if(!canApply())return;const rows=sortedFull();const already=rows.every((e,i)=>e.order===(i+1)*10);if(already&&state.sort==='manual'){notice('현재 order가 이미 10 단위로 정렬되어 있습니다.');return}if(!confirm(`전체 ${rows.length}개 용어의 order를 화면 정렬 순서에 따라 10, 20, 30…으로 다시 지정하시겠습니까?`))return;checkpoint();normalizeOrder(rows);state.sort='manual';$('sortMode').value='manual';resetEdit();drawList();drawInspector();updateStatus();notice('모든 항목의 order 값을 현재 정렬 순서로 재설정했습니다.','ok')}
function fitTextarea(ta){ta.style.height='auto';ta.style.height=Math.max(ta.scrollHeight,ta.classList.contains('inline-summary')?57:48)+'px'}
function trackText(input,field,update){input.addEventListener('focus',()=>resetEdit());input.addEventListener('input',()=>{const e=current();if(!e)return;checkpoint(`${field}:${e.id}`);update(e,input.value);updateStatus();if(field==='name'||field==='category'||field==='summary'){drawList();if(field==='category')drawFilters()}});input.addEventListener('blur',resetEdit)}
function makeTextarea(value,cls,label,fn){const a=el('textarea',cls);a.value=value;a.setAttribute('aria-label',label);a.rows=2;a.addEventListener('input',()=>fitTextarea(a));requestAnimationFrame(()=>fitTextarea(a));return a}
function drawCenter(){const host=$('centerContent');host.replaceChildren();const e=current();$('mainPanel').classList.toggle('readmode',state.preview);$('modeButton').textContent=state.preview?'✎ 편집 모드':'◉ 미리보기 모드';$('modeHint').textContent=state.preview?'인게임 데이터 표시 형태입니다. 편집하려면 편집 모드로 돌아가세요.':'용어명·요약·본문을 실제 표시 위치에서 직접 수정하세요.';if(!e){host.append(el('div','empty','왼쪽에서 용어를 선택하거나 「+ 새 용어」를 눌러 시작하세요.'));return}
const card=el('section','glossary-card');const name=el('input','inline-name');name.value=e.name;name.placeholder='새 용어';name.setAttribute('aria-label','용어명 직접 편집');name.readOnly=state.preview;trackText(name,'name',(cur,value)=>cur.name=value);card.append(name);
const summary=makeTextarea(e.summary,'inline-summary','요약 설명 직접 편집');summary.placeholder='이 위치에 요약을 입력하세요.';summary.readOnly=state.preview;trackText(summary,'summary',(cur,value)=>cur.summary=value);card.append(summary);
const paraHost=el('div');e.description.forEach((p,i)=>{const wrap=el('div','paragraph-block');wrap.append(el('div','paragraph-num edit-only',`상세 설명 ${i+1}`));const area=makeTextarea(p,'inline-paragraph',`${i+1}번 문단`);area.readOnly=state.preview;area.placeholder='이곳에 상세 설명을 작성하세요.';trackText(area,`paragraph-${i}`,(cur,v)=>cur.description[i]=v);wrap.append(area);const tools=el('div','block-tools edit-only');const up=btn('↑ 문단',()=>moveParagraph(i,-1));up.disabled=i===0;const down=btn('↓ 문단',()=>moveParagraph(i,1));down.disabled=i===e.description.length-1;tools.append(up,down,btn('문단 삭제',()=>{checkpoint();current().description.splice(i,1);resetEdit();redraw();},'danger'));wrap.append(tools);paraHost.append(wrap)});card.append(paraHost);
card.append(btn('＋ 설명 문단 추가',()=>{checkpoint();current().description.push('');resetEdit();drawCenter();updateStatus();const areas=$('centerContent').querySelectorAll('.inline-paragraph');areas[areas.length-1]?.focus()},'edit-only'));
card.append(el('div','links-label','관련 용어'));const links=el('div','links-row');for(const id of e.relatedIds){const target=state.doc.entries.find(x=>x.id===id);const chip=el('div','link-chip');chip.append(btn(target?.name||`알 수 없음 (${id})`,()=>choose(id),'jump'));chip.append(btn('×',()=>{checkpoint();current().relatedIds=current().relatedIds.filter(x=>x!==id);redraw()},'unlink'));links.append(chip)}if(!e.relatedIds.length)links.append(el('div','muted','관련 용어 없음'));card.append(links);
const adder=el('div','link-adder edit-only');adder.append(el('p','muted','다른 용어를 검색한 다음 「연결」을 누르면 인게임 관련 용어 버튼이 됩니다. 연결은 한 방향입니다.'));const find=el('input');find.placeholder='연결할 용어명 또는 ID 검색';find.setAttribute('aria-label','관련 용어 연결 검색');adder.append(find);const candidates=el('div','link-candidates');adder.append(candidates);function renderCandidates(){candidates.replaceChildren();const q=find.value.toLocaleLowerCase().trim();const pool=[...state.doc.entries].sort(compareStored).filter(x=>x.id!==e.id&&!e.relatedIds.includes(x.id)&&(!q||[x.id,x.name,x.category,...x.tags].some(v=>v.toLocaleLowerCase().includes(q)))).slice(0,50);if(!pool.length){candidates.append(el('div','muted','연결 가능한 용어가 없습니다.'));return}for(const t of pool){const b=btn(`＋ ${t.name}`,()=>{checkpoint();current().relatedIds.push(t.id);resetEdit();drawCenter();updateStatus();notice(`${t.name} 관련 용어를 연결했습니다.`,'ok')});b.append(el('small','',t.category));candidates.append(b)}}find.addEventListener('input',renderCandidates);renderCandidates();card.append(adder);host.append(card)}
function moveParagraph(i,delta){const e=current(),j=i+delta;if(j<0||j>=e.description.length)return;checkpoint();[e.description[i],e.description[j]]=[e.description[j],e.description[i]];resetEdit();redraw()}
function property(host,title,value,fn){const outer=el('div','prop');const lab=el('label','',title);const inp=el('input');inp.value=value;outer.append(lab,inp);inp.addEventListener('focus',resetEdit);inp.addEventListener('input',()=>{const e=current();if(!e)return;checkpoint(`${title}:${e.id}`);fn(e,inp.value);updateStatus();if(title==='분류'){drawFilters();drawList()}else if(title==='order'){drawList()}});inp.addEventListener('blur',resetEdit);host.append(outer);return inp}
function drawInspector(){const host=$('inspectorContent');host.replaceChildren();const e=current();if(!e){host.append(el('div','empty','선택한 항목이 없습니다.'));return}
const idbox=el('div','prop');idbox.append(el('label','','고유 ID'));const row=el('div','prop-row'),idInput=el('input');idInput.value=e.id;idInput.setAttribute('aria-label','고유 ID');row.append(idInput,btn('ID 변경',()=>renameId(idInput.value)));idInput.addEventListener('keydown',ev=>{if(ev.key==='Enter')renameId(idInput.value)});idbox.append(row,el('p','hint','소문자 영문 시작 · 숫자, _, - 허용 · 최대 64자. 변경 시 연결 참조도 갱신.'));host.append(idbox);
const categories=[...new Set(state.doc.entries.map(x=>x.category))].sort(collate);const cat=property(host,'분류',e.category,(cur,v)=>cur.category=v);cat.setAttribute('list','categoryOptions');const datalist=el('datalist');datalist.id='categoryOptions';categories.forEach(c=>{const o=el('option');o.value=c;datalist.append(o)});host.append(datalist);
const ord=property(host,'order',String(e.order),(cur,v)=>{cur.order=/^-?\d+$/.test(v.trim())?Number(v):v});ord.setAttribute('inputmode','numeric');host.append(el('p','hint','정렬 적용·드래그 시 전체 order를 10 간격으로 재지정합니다.'));
host.append(el('hr'));host.append(el('div','section-label','검색용 태그'));const tags=el('div','tag-list');for(const t of e.tags){const item=el('span','tag-chip',t);item.append(btn('×',()=>{checkpoint();current().tags.splice(current().tags.indexOf(t),1);resetEdit();redraw()}));tags.append(item)}host.append(tags);const tagrow=el('div','prop-row'),tag=el('input');tag.placeholder='태그 입력';tag.setAttribute('aria-label','태그 추가');const addTag=()=>{const v=tag.value.trim();if(!v)return;if(current().tags.includes(v)){notice('중복 태그입니다.','error');return}checkpoint();current().tags.push(v);resetEdit();redraw()};tag.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();addTag()}});tagrow.append(tag,btn('추가',addTag));host.append(tagrow,el('p','hint','태그는 검색 및 태그 정렬에 사용됩니다. 게임 용어집 본문에는 직접 표시되지 않습니다.'));
host.append(el('hr'));host.append(el('div','section-label','항목 관리'));const actions=el('div','toolrow');actions.append(btn('항목 복제',duplicate),btn('항목 삭제',remove,'danger'));host.append(actions);
host.append(el('hr'));host.append(el('div','section-label','현재 연결 상태'));const inbound=state.doc.entries.filter(x=>x.id!==e.id&&x.relatedIds.includes(e.id));host.append(el('p','warnline',`이 용어를 참조하는 다른 용어: ${inbound.length}개${inbound.length?' ('+inbound.map(x=>x.name).join(', ')+')':''}`));host.append(el('p','warnline',`나가는 관련 용어: ${e.relatedIds.length}개`));host.append(el('div','section-label','DB 정보'));host.append(el('p','warnline',`schemaVersion: ${state.doc.schemaVersion} / 용어: ${state.doc.entries.length}개 / 게임 최대: 500개`))}
function redraw(){drawFilters();drawList();drawCenter();drawInspector();updateStatus()}
function newEntry(){if(state.doc.entries.length>=500){notice('최대 500개 항목을 초과할 수 없습니다.','error');return}const prev=current();const sorted=[...state.doc.entries].sort(compareStored);const last=sorted[sorted.length-1];const next={id:uniqueId('new_term'),category:prev?.category||'기타',order:(last?.order||0)+10,name:'새 용어',summary:'',description:[],tags:[],relatedIds:[]};checkpoint();state.doc.entries.push(next);state.search='';state.filter='';state.sort='manual';$('search').value='';$('sortMode').value='manual';state.listMode='game';state.preview=false;resetEdit();state.selected=next.id;redraw();$('centerContent').querySelector('.inline-name')?.focus();notice('새 용어가 목록에 추가되었습니다. 중앙 영역에서 바로 작성하세요.','ok')}
function duplicate(){const e=current();if(!e)return;if(state.doc.entries.length>=500){notice('최대 500개를 초과할 수 없습니다.','error');return}checkpoint();const next=clone(e);next.id=uniqueId(e.id.slice(0,48)+'_copy');next.name=e.name+' (복제)';next.order=Math.max(0,...state.doc.entries.map(x=>Number.isInteger(x.order)?x.order:0))+10;state.doc.entries.push(next);state.selected=next.id;state.filter='';state.search='';state.sort='manual';$('search').value='';$('sortMode').value='manual';state.preview=false;resetEdit();redraw();notice('복제 용어를 만들었습니다.','ok')}
function renameId(next){const e=current();if(!e||next===e.id)return;if(!rule.test(next)){notice('ID 형식 오류: 영문 소문자로 시작하고 소문자, 숫자, _, -만 허용합니다(1~64자).','error');return}if(state.doc.entries.some(x=>x.id===next)){notice('동일한 ID가 이미 존재합니다.','error');return}checkpoint();const old=e.id;e.id=next;for(const other of state.doc.entries)other.relatedIds=other.relatedIds.map(id=>id===old?next:id);state.selected=next;resetEdit();redraw();notice(`ID ${old} → ${next} 변경 및 관련 참조 갱신 완료`,'ok')}
function remove(){const e=current();if(!e)return;const inbound=state.doc.entries.filter(x=>x.relatedIds.includes(e.id));if(!confirm(`「${e.name}」 용어를 삭제하시겠습니까?\n이 용어를 참조하는 ${inbound.length}개 항목의 관련 링크도 제거됩니다.`))return;checkpoint();state.doc.entries=state.doc.entries.filter(x=>x.id!==e.id);for(const x of state.doc.entries)x.relatedIds=x.relatedIds.filter(id=>id!==e.id);state.selected=[...state.doc.entries].sort(compareStored)[0]?.id||null;resetEdit();redraw();notice('항목 및 해당 항목을 가리키던 링크를 삭제했습니다.','ok')}
function updateStatus(){if(!state.doc)return;const errors=validate(state.doc);$('validation').textContent=errors.length?`검사 오류 ${errors.length}건: ${errors.slice(0,2).join(' / ')}${errors.length>2?' …':''}`:`✓ DB 형식 검사 통과 · ${state.doc.entries.length}개`;$('validation').className=errors.length?'error':'ok';$('exportFile').disabled=!!errors.length;$('newEntry').disabled=state.doc.entries.length>=500;$('undo').disabled=!state.undo.length;$('redo').disabled=!state.redo.length;$('dirtyMark').textContent=isDirty()?'● 미내보내기 변경 있음':'✓ 내보내기 기준 변경 없음';$('dirtyMark').className=isDirty()?'is-dirty':'';$('source').textContent=state.source;drawSortHelp()}
function restore(type){const src=type==='undo'?state.undo:state.redo,dst=type==='undo'?state.redo:state.undo;if(!src.length)return;dst.push(clone(state.doc));state.doc=src.pop();if(!state.doc.entries.some(e=>e.id===state.selected))state.selected=[...state.doc.entries].sort(compareStored)[0]?.id||null;resetEdit();redraw();notice(type==='undo'?'작업 되돌림 완료':'작업 다시 실행 완료','ok')}
function outputDoc(){const doc=clone(state.doc);doc.entries.sort(compareStored);const root={schemaVersion:doc.schemaVersion,entries:doc.entries.map(e=>{const item={};for(const key of schemaKeys)item[key]=e[key];for(const key of Object.keys(e))if(!schemaKeys.includes(key))item[key]=e[key];return item})};for(const key of Object.keys(doc))if(!['schemaVersion','entries'].includes(key))root[key]=doc[key];return root}
function importDoc(value,source){const errors=validate(value);if(errors.length)throw new Error(errors.slice(0,6).join(' / '));state.doc=clone(value);state.selected=[...state.doc.entries].sort(compareStored)[0]?.id||null;state.baseline=fingerprint(state.doc);state.source=source;state.undo=[];state.redo=[];state.sort='manual';state.search='';state.filter='';state.preview=false;state.listMode='game';$('search').value='';$('sortMode').value='manual';resetEdit();redraw();notice(`「${source}」 ${state.doc.entries.length}개 용어를 불러왔습니다.`,'ok')}
async function loadFile(file){if(!file)return;if(isDirty()&&!confirm('내보내지 않은 변경 사항이 있습니다. 현재 작업을 버리고 새 파일을 여시겠습니까?'))return;try{const content=(await file.text()).replace(/^\ufeff/,'');importDoc(JSON.parse(content),file.name)}catch(err){notice(`불러오기 실패: ${err.message}`,'error')}}
function exportFile(){const errors=validate(state.doc);if(errors.length){notice('검사 오류를 수정해야 JSON을 내보낼 수 있습니다.','error');return}const doc=outputDoc();const data=JSON.stringify(doc,null,2)+'\n';const blob=new Blob([data],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='glossary_db.json';document.body.append(a);try{a.click();state.baseline=fingerprint(state.doc);notice('glossary_db.json 다운로드를 요청했습니다. 브라우저에서 저장 결과를 확인하세요.','ok')}catch(err){notice(`다운로드 요청 실패: ${err.message}`,'error')}finally{a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);updateStatus()}}
$('search').addEventListener('input',ev=>{state.search=ev.target.value;drawList();drawSortHelp()});$('categoryFilter').addEventListener('change',ev=>{state.filter=ev.target.value;drawList()});$('sortMode').addEventListener('change',ev=>{state.sort=ev.target.value;if(state.sort!=='manual')state.listMode='work';drawList()});$('gameView').addEventListener('click',()=>{state.listMode='game';state.sort='manual';$('sortMode').value='manual';drawList()});$('workView').addEventListener('click',()=>{state.listMode='work';drawList()});$('applyOrder').addEventListener('click',applyOrder);$('modeButton').addEventListener('click',()=>{state.preview=!state.preview;drawCenter();drawList()});$('newEntry').addEventListener('click',newEntry);$('exportFile').addEventListener('click',exportFile);$('undo').addEventListener('click',()=>restore('undo'));$('redo').addEventListener('click',()=>restore('redo'));$('openFile').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',async ev=>{await loadFile(ev.target.files?.[0]);ev.target.value=''});
$('fileDrop').addEventListener('dragover',ev=>{if([...ev.dataTransfer?.types||[]].includes('Files'))ev.preventDefault()});$('fileDrop').addEventListener('drop',ev=>{if(ev.dataTransfer?.files?.length){ev.preventDefault();void loadFile(ev.dataTransfer.files[0])}});
window.addEventListener('beforeunload',ev=>{if(isDirty()){ev.preventDefault();ev.returnValue=''}});
try{importDoc(JSON.parse($('seed').textContent),'내장 glossary_db.json')}catch(err){notice('초기 DB 오류: '+err.message,'error')}
window.glossaryEditorQA={getState:()=>clone(state.doc),getSelected:()=>state.selected,outputDoc,validate,sortedFull:()=>sortedFull().map(e=>e.id),visible:()=>visible().map(e=>e.id),setSelected,renameId,applyOrder,reorder,shiftOrder,newEntry,importDoc,restore,editingOrder,gameGrouped:()=>gameGrouped([...state.doc.entries].sort(compareStored)).map(([k,v])=>[k,v.map(e=>e.id)])};
})();
</script></body></html>
