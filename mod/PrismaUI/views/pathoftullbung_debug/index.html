<title>Path of TULLBUNG</title>

<style>
:root {
    --ink:#2a2116;
    --line:#59472e;
    --gold:#b67b20;
    --paper:rgba(244,235,201,.90);
    --paper2:rgba(250,244,220,.86);
    --paper3:rgba(223,199,143,.72);
    --muted:#746249;

    --shell-bg:rgba(244,235,201,.90);
    --topbar-bg:rgba(250,243,216,.91);
    --left-bg:rgba(248,240,210,.77);
    --center-bg:rgba(245,235,199,.69);
    --right-bg:rgba(250,243,217,.84);
    --title-bg:rgba(255,249,226,.28);
    --summary-bg:rgba(255,249,226,.35);
    --node-section-bg:rgba(255,249,226,.18);
    --description-bg:rgba(255,250,230,.46);
    --notice-bg:rgba(196,139,54,.12);
    --footer-bg:rgba(228,207,158,.68);
    --frame-line:rgba(89,71,46,1);
    --panel-line:rgba(89,71,46,1);
    --card-bg:rgba(255,249,226,.43);
    --card-hover-bg:rgba(223,199,143,.72);
    --card-line:rgba(89,71,46,.72);
    --title-line:rgba(89,71,46,.48);
    --summary-line:rgba(89,71,46,.45);
    --node-section-line:rgba(89,71,46,.34);
    --description-line:rgba(89,71,46,1);
    --notice-line:rgba(166,108,28,.50);
    --footer-line:rgba(89,71,46,.35);
    --divider-line:rgba(89,71,46,.35);
}

* {
    box-sizing:border-box;
}

html,
body {
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    color:var(--ink);
    background:transparent;
    font-family:"Malgun Gothic",sans-serif;
}

body {
    display:flex;
    align-items:center;
    justify-content:center;
}

#shell {
    width:92vw;
    height:90vh;
    min-width:1000px;
    min-height:620px;

    display:grid;
    grid-template-rows:56px 1fr 30px;

    border:3px solid var(--frame-line);
    background:var(--shell-bg);

    box-shadow:
        0 18px 40px
        rgba(0,0,0,.32);
}

#topbar {
    display:flex;
    border-bottom:2px solid var(--panel-line);
    background:var(--topbar-bg);
}

.tab,
#closeButton {
    border:0;
    color:var(--ink);
    background:transparent;
    cursor:pointer;
}

.tab {
    width:164px;
    border-right:2px solid var(--line);
    font-size:18px;
    font-weight:700;
}

.tab:hover,
.tab.active {
    background:var(--paper3);
}

#topSpacer {
    flex:1;
}

#closeButton {
    width:58px;
    border-left:2px solid var(--line);
    font-size:25px;
}

#body.s18-glossary-layout{grid-template-columns:260px minmax(500px,1fr) 360px}
#body.s18-glossary-layout #rightPanel{display:block}
#body.s18-glossary-layout .s18-reset-jobs-row{display:none!important}

#body {
    min-height:0;

    display:grid;
    grid-template-columns:
        260px
        minmax(500px,1fr)
        360px;
}

#leftPanel,
#centerPanel,
#rightPanel {
    min-height:0;
    overflow-y:auto;
}

#leftPanel {
    padding:17px 14px;
    border-right:2px solid var(--panel-line);
    background:var(--left-bg);
}

#centerPanel {
    padding:24px;
    background:var(--center-bg);
}

#rightPanel {
    padding:20px;
    border-left:2px solid var(--panel-line);
    background:var(--right-bg);
}

.sectionLabel {
    margin-bottom:14px;
    font-size:12px;
    letter-spacing:.10em;
    color:var(--muted);
}

.groupTitle {
    margin:18px 0 7px;
    padding-bottom:5px;

    border-bottom:
        1px solid
        rgba(89,71,46,.35);

    font-size:12px;
    font-weight:700;
    color:var(--muted);
}

.leftItem,
.card,
.action {
    border:
        1px solid
        rgba(89,71,46,.72);

    background:
        rgba(255,249,226,.43);
}

.leftItem {
    padding:12px;
    margin-bottom:8px;
    cursor:pointer;
}

.leftItem:hover,
.leftItem.active,
.card:hover,
.action:hover {
    border-color:var(--gold);
    background:var(--paper3);
}

.leftTitle,
.cardTitle {
    font-weight:700;
}

.leftTitle {
    font-size:16px;
}

.small {
    margin-top:6px;
    color:var(--muted);
    font-size:12px;
}

h1 {
    margin:0 0 7px;
    font-size:28px;
}

.subtitle {
    margin-bottom:18px;
    color:var(--muted);
    font-size:13px;
}

/* Fixed title section */
#titleSection {
    min-height:105px;
    margin-bottom:14px;
    padding:16px 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid
        rgba(89,71,46,.48);

    background:var(--title-bg);
}

#titleInner {
    width:100%;
    text-align:center;
}

#titleLabel {
    font-size:12px;
    letter-spacing:.14em;
    color:var(--muted);
}

#titleName {
    margin-top:8px;
    font-size:27px;
    font-weight:700;
}

#titleNote {
    margin-top:5px;
    font-size:11px;
    color:var(--muted);
}

.summaryGrid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.summary {
    padding:12px;

    border:
        1px solid
        rgba(89,71,46,.45);

    background:var(--summary-bg);
}

.summary strong {
    display:block;
    margin-top:4px;
    font-size:20px;
}

/* Square node icon region */
#nodeSection {
    min-height:320px;
    padding:18px;

    border:
        1px solid
        rgba(89,71,46,.34);

    background:var(--node-section-bg);
}

.nodeGrid {
    display:grid;

    grid-template-columns:
        repeat(auto-fill,88px);

    gap:18px;

    justify-content:center;
    align-content:start;
}

.nodeIcon {
    position:relative;

    width:88px;
    height:88px;

    display:block;

    border:0;
    outline:0;
    background:transparent;
    padding:0;
    box-sizing:border-box;

    cursor:pointer;
}

.nodeIcon:hover,
.nodeIcon.owned,
.nodeIcon.active,
.nodeIcon.master {
    border:0;
    outline:0;
    background:transparent;
}

.nodeVisual {
    --node-dim-brightness:.34;
    --node-dim-saturation:.58;

    position:relative;
    display:block;
    width:100%;
    height:100%;
}

.nodeVisualLayer {
    position:absolute;
    inset:0;

    display:block;
    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;
    user-select:none;
}

.nodeVisualBackground {
    z-index:0;
}

.nodeVisualGlyph {
    z-index:1;
}

.nodeVisualBorder {
    z-index:2;
}

/* 미투자:
   border/background/glyph 모두 동일 기하,
   밝기만 낮춘다. */
.nodeVisual.uninvested .nodeVisualLayer {
    filter:
        brightness(var(--node-dim-brightness))
        saturate(var(--node-dim-saturation));
}

/* 투자했으나 비활성:
   border는 활성과 동일,
   내부 background/glyph만 어둡게. */
.nodeVisual.inactive .nodeVisualBackground,
.nodeVisual.inactive .nodeVisualGlyph {
    filter:
        brightness(var(--node-dim-brightness))
        saturate(var(--node-dim-saturation));
}

.nodeVisual.inactive .nodeVisualBorder,
.nodeVisual.active .nodeVisualLayer {
    filter:none;
}

.card {
    padding:14px;
    margin-bottom:10px;
}

.action {
    min-height:44px;
    padding:9px 13px;
    margin-top:9px;
    color:var(--ink);
    cursor:pointer;
}

.action.danger {
    border-color:#87563e;
}

#descriptionBox {
    min-height:310px;
    padding:16px;

    border:2px solid var(--line);

    background:var(--description-bg);
}

#detailTitle {
    font-size:21px;
    font-weight:700;
}

#detailType {
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
}

.detailLabel {
    margin:20px 0 8px;
    font-size:12px;
    font-weight:700;
}

.detailText {
    line-height:1.6;
    font-size:14px;
}

#nodePreview {
    width:240px;
    height:240px;
    box-sizing:border-box;

    margin:14px auto 4px;
    padding:8px;

    border:
        1px solid
        var(--divider-line);

    background:
        var(--description-bg);
}

#nodePreview[hidden] {
    display:none;
}

#nodePreview .nodeVisual {
    width:100%;
    height:100%;
}

.notice {
    padding:13px;
    margin-bottom:14px;

    border:
        1px solid
        rgba(166,108,28,.5);

    background:var(--notice-bg);

    font-size:12px;
    line-height:1.6;
}


/* Stage18 settings controls */
.settingsRow {
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:10px;
}

.settingsRow > label {
    min-width:160px;
    font-weight:700;
}

.settingsRow input[type="range"] {
    flex:1;
}

.settingsValue {
    min-width:68px;
    text-align:right;
    font-variant-numeric:tabular-nums;
}

.settingsButton {
    min-height:36px;
    padding:7px 11px;
    border:1px solid rgba(89,71,46,.72);
    color:var(--ink);
    background:rgba(255,249,226,.62);
    cursor:pointer;
}

.settingsButton:hover {
    border-color:var(--gold);
    background:var(--paper3);
}
.card {
    border-color:var(--card-line);
    background:var(--card-bg);
}

.card:hover {
    background:var(--card-hover-bg);
}

.groupTitle {
    border-bottom-color:var(--divider-line);
}

#titleSection {
    border-color:var(--title-line);
}

.summary {
    border-color:var(--summary-line);
}

#nodeSection {
    border-color:var(--node-section-line);
}

#descriptionBox {
    border-color:var(--description-line);
}

.notice {
    border-color:var(--notice-line);
}

#footer {
    border-top-color:var(--footer-line);
}

#devStatus {
    margin-top:14px;
    color:#795725;
    font-size:13px;
}

#footer {
    display:flex;
    align-items:center;

    padding:0 12px;

    border-top:
        1px solid
        rgba(89,71,46,.35);

    background:var(--footer-bg);

    color:var(--muted);
    font-size:10px;
}

#potFooterStatus{margin-left:auto;display:flex;align-items:center;gap:12px}
#shell #footer #potFooterDev{appearance:none!important;display:inline;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important;text-shadow:inherit!important;color:inherit!important;font:inherit;letter-spacing:inherit;line-height:inherit;min-width:0!important;min-height:0!important;cursor:inherit}
</style>
<style id="S18L_CENTER_GRID_FRAMEWORK">
.centerGridSurface{
    --s18-grid-columns:12;
    --s18-grid-row:44px;

    display:grid;
    grid-template-columns:
        repeat(
            var(--s18-grid-columns),

        );
    grid-auto-rows:var(--s18-grid-row);
    gap:10px;

    width:100%;

<style id="S18_B5B1_PRESET_CONTROLS">

<script>
let currentTab =
    "home";

let buildState =
    null;

let selectedClassID =
    0;

let selectedDev =
    "build";

let settingsDevOpen =
    false;

let settingsState =
    null;

function getNodePresentation(node)
{
    const qa15Sentinel=Number(node.classId)===12&&Number(node.id)>=192&&Number(node.id)<=197;
    const data = qa15Sentinel ? [Number(node.id)===197?"QA15 검증 마스터":"QA15 검증 노드 "+String(Number(node.id)-191),"저장·업데이트 검증 전용 가상 노드입니다. 실제 게임 효과는 없습니다."] : nodePresentation[node.id];

    if (node.key ===
        "inquisitor.master") {

        const rawKills =
            Number(
                buildState &&
                buildState.inquisitorKills);

        const rawDamage =
            Number(
                buildState &&
                buildState.smiteDamage);

        const kills =
            Number.isFinite(rawKills) ?
                Math.max(
                    0,
                    Math.min(
                        500,
                        Math.trunc(rawKills))) :
                0;

        const damage =
            Number.isFinite(rawDamage) ?
                Math.trunc(rawDamage) :
                300;

        const progress =
            kills >= 500 ?
                "완료" :
                `${String(
                    kills % 100
                ).padStart(
                    3,
                    "0"
                )}/100`;

        const baseName =
            data ?
                data[0] :
                "대심문관";

        const baseDescription =
            data ?
                data[1] :
                "마물 처치 100회마다 신벌 피해가 100 증가하며, 최대 800까지 증가합니다.";

        return {
            name:
                `${baseName} [${progress} | 신벌 피해 ${damage}]`,
            description:
                baseDescription
        };
    }

    return data ?
        {
            name: data[0],
            description: data[1]
        } :
        {
            name: node.code,
            description:
                node.master ?
                    "마스터 노드" :
                    "직업 노드"
        };
}

function send(command)
{
    if (typeof tullDebugCommand ===
        "function") {

        tullDebugCommand(command);

        if (command.startsWith(
                "debug.inq.kills.")) {

            window.setTimeout(
                () => {
                    tullDebugCommand(
                        "build.refresh");
                },
                50);
        }
    }
}

function clamp01(value)
{
    const number =
        Number(value);

    if (!Number.isFinite(number)) {
        return 1;
    }

    return Math.max(
        0,
        Math.min(
            1,
            number));
}

function sendSetting(
    key,
    value)
{
    send(
        `settings.set.${key}=${value}`);
}

function formatHotkey()
{
    if (!settingsState) {
        return "대기 중";
    }

    const parts = [];

    if (settingsState.menuCtrl) {
        parts.push("Ctrl");
    }

    if (settingsState.menuShift) {
        parts.push("Shift");
    }

    if (settingsState.menuAlt) {
        parts.push("Alt");
    }

    const keyCode =
        Number(
            settingsState.menuKey);

    const known = {

    };

function detail(title, type, description, record, nodeID = null)
{

        buildState && Array.isArray(buildState.nodes)) ?
        buildState.nodes.find(entry => entry.id === Number(nodeID)) : null;

    const cost =
        node && Number.isFinite(Number(node.cost)) ?
            Math.max(0,Math.trunc(Number(node.cost))) :
            null;

    const jpBadge = document.getElementById("detailJP");
    const masterBadge = document.getElementById("detailMaster");
    const typeLabel = document.getElementById("detailType");

    document.getElementById("detailTitle").textContent = title;
    document.getElementById("detailDescription").textContent = description;
    document.getElementById("detailRecord").textContent = record;

    if (node && cost !== null) {
        jpBadge.textContent = `${cost} JP`;
        jpBadge.hidden = false;

        masterBadge.hidden = !node.master;
        if (node.master) {
            masterBadge.textContent = 'MASTER';

        jpBadge.hidden = true;

        typeLabel.textContent = type;
        typeLabel.hidden = false;

    renderNodePreview(nodeID);

function s18ClassCardSubtitle(cls, classes) {
    const level = `Lv.${cls.level}`;

    if (cls.owned) {
        return level;
    }

    const parentKey = s18AdvancedParentKeys[cls.key];
    if (!parentKey) {
        return `${level} · 미획득`;

    const parent = classes.find(

function createNodeVisual(
    node,
    classId)
{
    const assets =
        window.TULLNodeAssets;

    if (!assets) {
        throw new Error(
            "TULLNodeAssets registry is not loaded");
    }

    const family =
        assets.classFamily[
            String(classId)];

    if ((!family || !assets.backgrounds[family]) && Number(classId)!==12) {

        throw new Error(
            `Missing class-family asset mapping: ${classId}`);
    }

    const nodeKey =
        String(node.id);

    const glyph =
        assets.glyphs[nodeKey] ||
        assets.placeholder;

    const border =
        node.master ?
            assets.borders.master :
            assets.borders.normal;

    const state =
        !node.owned ?
            "uninvested" :
            (node.active ?
                "active" :
                "inactive");

    const visual =
        document.createElement(
            "span");

    visual.className =
        `nodeVisual ${state}`;

    visual.dataset.assetKind =
        assets.glyphs[nodeKey] ?
            "production" :
            "placeholder";

    const makeLayer =
        (className, relativePath) => {

            const image =
                document.createElement(
                    "img");

            image.className =
                `nodeVisualLayer ${className}`;

            image.src =
                `${assets.root}/${relativePath}`;

            image.alt = "";
            image.draggable = false;

            image.setAttribute(
                "aria-hidden",
                "true");

            visual.appendChild(
                image);
        };

    if(family&&assets.backgrounds[family])makeLayer("nodeVisualBackground",assets.backgrounds[family]);

    makeLayer(
        "nodeVisualGlyph",
        glyph);

    makeLayer(
        "nodeVisualBorder",
        border);

    return visual;
}

const s18GridLayout = {
    columns:12,

    // Provisional coordinates only.
    // Grid geometry / exact zone boundaries are not LOCKed yet.
    zones:{
        TITLE:{
            rowStart:0,
            rowEnd:1,
            allowed:["titleBlock"]
        },
        SUMMARY:{
            rowStart:2,
            rowEnd:3,
            allowed:["statBlock"]
        },
        NODE:{
            rowStart:5,
            rowEnd:null,
            allowed:["nodeBlock"]
        }
    }
};

function s18GridBlock(
    element,
    type,
    zone,
    x,
    y,
    w,
    h)
{
    element.classList.add(
        "gridBlock",
        type);

    element.dataset.gridZone=zone;

    element.dataset.gridType=type;

    element.dataset.resizePolicy=
        type === "nodeBlock" ?
            "aspect-locked" :
            "free";

    if (!element.dataset.blockKey) {

        if (type === "titleBlock") {

            element.dataset.blockKey=
                "title";

        } else if (type === "nodeBlock") {

            const classID=
                element.dataset.classId;

            const nodeID=
                element.dataset.nodeId;

            if (classID && nodeID) {

                element.dataset.blockKey=
                    `node.${classID}.${nodeID}`;
            }
        }
    }
    element.dataset.gridX=x;
    element.dataset.gridY=y;
    element.dataset.gridW=w;
    element.dataset.gridH=h;
    element.dataset.profileInitialGeometry=JSON.stringify({x,y,w,h});

    element.style.gridColumn=
        `${x + 1} / span ${w}`;

    element.style.gridRow=
        `${y + 1} / span ${h}`;
}

function s18UpgradeCenterGrid()
{
    const center=
        document.getElementById(
            "centerPanel");

    if (!center ||
        center.querySelector(
            ".centerGridSurface")) {

        return;
    }

    const title=
        center.querySelector(
            "#titleSection");

    const summary=
        center.querySelector(
            ".summaryGrid");

    const nodeSection=
        center.querySelector(
            "#nodeSection");

    const nodeGrid=
        nodeSection ?
            nodeSection.querySelector(
                ".nodeGrid") :
            null;

    if (!title &&
        !summary &&
        !nodeGrid) {

        return;
    }

    const summaryBlocks=
        summary ?
            [...summary.children] :
            [];

    const nodeBlocks=
        nodeGrid ?
            [...nodeGrid.children] :
            [];

    const first=
        title ||
        summary ||
        nodeSection;

    const surface=
        document.createElement(
            "div");

    surface.className=
        "centerGridSurface";

    surface.dataset.gridColumns=
        String(
            s18GridLayout.columns);

    surface.dataset.layoutRevision=
        "S18L-UNIFIED-1";

    surface.dataset.classId=
        String(selectedClassID);

    center.insertBefore(
        surface,
        first);

    // TITLE Zone
    if (title) {
        s18GridBlock(
            title,
            "titleBlock",
            "TITLE",
            0,
            s18GridLayout.zones.TITLE.rowStart,
            12,
            2);

        surface.appendChild(
            title);
    }

    // SUMMARY Zone
    summaryBlocks.forEach(
        (block,index) => {

            s18GridBlock(
                block,
                "statBlock",
                "SUMMARY",
                index * 3,
                s18GridLayout.zones.SUMMARY.rowStart,
                3,
                2);

            surface.appendChild(
                block);
        });

    // NODE Zone
    nodeBlocks.forEach(
        (block,index) => {

            const column=
                (index % 6) * 2;

            const row=
                s18GridLayout.zones.NODE.rowStart +
                Math.floor(index / 6) * 2;

            s18GridBlock(
                block,
                "nodeBlock",
                "NODE",
                column,
                row,
                2,
                2);

            surface.appendChild(
                block);
        });

    // Former layout containers no longer own coordinates.
    if (summary) {
        summary.remove();
    }

    if (nodeSection) {
        nodeSection.remove();
    }

    window.dispatchEvent(
        new CustomEvent(
            "tull-grid-ready",
            {
                detail:{
                    classId:selectedClassID
                }
            }));
}

// S18 B5-D2: External JSON is the only glossary data authority.
const s18GlossaryState = {
    entries:[],
    selectedId:null,
    search:"",
    loaded:false,
    loading:false,
    error:""
};

function s18ValidateGlossary(doc) {
    if (!doc || doc.schemaVersion !== 1 ||
        !Array.isArray(doc.entries) || doc.entries.length > 500) {
        throw new Error("지원하지 않는 용어집 DB 형식");
    }

    const seen = new Set();
    const entries = doc.entries.map((item,index) => {
        if (!item || typeof item !== "object" ||
            typeof item.id !== "string" ||
            !/^[a-z][a-z0-9_-]{0,63}$/.test(item.id) ||
            seen.has(item.id) ||
            typeof item.name !== "string" || !item.name.trim() ||
            typeof item.category !== "string" || !item.category.trim() ||
            typeof item.summary !== "string" ||
            !Number.isInteger(item.order) ||
            !Array.isArray(item.description) ||
            !item.description.every(p => typeof p === "string") ||
            !Array.isArray(item.tags) ||
            !item.tags.every(tag => typeof tag === "string") ||
            !Array.isArray(item.relatedIds) ||
            !item.relatedIds.every(id => typeof id === "string")) {
            throw new Error(`용어집 항목 ${index+1}의 필드 오류`);
        }

        seen.add(item.id);
        return {
            id:item.id,
            name:item.name.trim(),
            category:item.category.trim(),
            order:item.order,
            summary:item.summary,
            description:item.description,
            tags:item.tags,
            relatedIds:item.relatedIds
        };
    });

    for (const entry of entries) {
        if (entry.relatedIds.some(id => !seen.has(id))) {
            throw new Error(`관련 용어 참조 오류: ${entry.id}`);
        }
    }

    entries.sort((a,b) =>
        a.order-b.order ||
        a.name.localeCompare(b.name,"ko") ||
        a.id.localeCompare(b.id)
    );
    return entries;
}

async function s18ReadGlossaryText() {
    const path = "assets/glossary/glossary_db.json";
    let firstError = null;

    if (typeof fetch === "function") {
        try {
            const response = await fetch(path,{cache:"no-store"});
            if (!response.ok && response.status !== 0) {
                throw new Error(`HTTP ${response.status}`);
            }
            return await response.text();
        } catch (error) {
            firstError = error;
        }
    }

    if (typeof XMLHttpRequest === "function") {
        return await new Promise((resolve,reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("GET",path,true);

            xhr.onload = () => {
                if ((xhr.status >= 200 && xhr.status < 300) ||
                    (xhr.status === 0 && xhr.responseText)) {
                    resolve(xhr.responseText);
                } else {
                    reject(new Error(`JSON 요청 실패 (${xhr.status})`));
                }
            };

            xhr.onerror = () =>
                reject(new Error("JSON 파일을 읽을 수 없습니다"));

            try {
                xhr.send();
            } catch (error) {
                reject(error);
            }
        });
    }

    throw firstError ||
        new Error("Prisma JSON 로딩 API를 사용할 수 없습니다");
}

async function s18LoadGlossary() {
    if (s18GlossaryState.loading) return;

    s18GlossaryState.loading = true;
    s18GlossaryState.loaded = true;

    try {
        const text = await s18ReadGlossaryText();
        const entries = s18ValidateGlossary(JSON.parse(text));

        s18GlossaryState.entries = entries;
        s18GlossaryState.error = "";

        if (!entries.some(e => e.id === s18GlossaryState.selectedId)) {
            s18GlossaryState.selectedId = entries[0]?.id || null;
        }
    } catch (error) {
        s18GlossaryState.error =
            String(error?.message || error).slice(0,180);
        console.warn("[S18Glossary] 외부 DB 로딩 실패",error);
    } finally {
        s18GlossaryState.loading = false;
        if (currentTab === "glossary") renderGlossary();
    }
}

function renderGlossary() {
    clearPanels();

    detail(
        "Path of TULLBUNG 용어집",
        "용어 모음",
        "Path of TULLBUNG의 직업, 스킬과 시스템에서 사용하는 용어를 모았습니다.",
        "",
        null);

    const left = document.getElementById("leftPanel");
    const center = document.getElementById("centerPanel");

    const heading = document.createElement("div");
    heading.className = "sectionLabel";
    heading.textContent = "용어집";
    left.appendChild(heading);

    const search = document.createElement("input");
    search.type = "search";
    search.className = "s18-glossary-search";
    search.placeholder = "용어 검색";
    search.setAttribute("aria-label","용어 검색");
    search.value = s18GlossaryState.search;
    left.appendChild(search);

    const list = document.createElement("div");
    left.appendChild(list);

    const head = document.createElement("h1");
    head.textContent = "용어집";
    center.appendChild(head);

    const refresh = document.createElement("button");
    refresh.type = "button";
    refresh.className = "settingsButton";
    refresh.textContent = "DB 새로고침";
    refresh.disabled = s18GlossaryState.loading;
    refresh.addEventListener("click",() => {
        void s18LoadGlossary();
    });
    center.appendChild(refresh);

    const content = document.createElement("div");
    content.className = "s18-glossary-detail";
    center.appendChild(content);

    function draw() {
        list.replaceChildren();
        content.replaceChildren();

        if (s18GlossaryState.error) {
            const error = document.createElement("div");
            error.className = "notice";
            error.setAttribute("role","alert");
            error.textContent =
                `용어집 DB 오류: ${s18GlossaryState.error}`;
            content.appendChild(error);
        }

        if (s18GlossaryState.loading &&
            !s18GlossaryState.entries.length) {
            const status = document.createElement("p");
            status.textContent = "용어집 데이터를 읽는 중입니다.";
            content.appendChild(status);
            return;
        }

        const q = s18GlossaryState.search.trim().toLocaleLowerCase();
        const shown = s18GlossaryState.entries.filter(e =>
            !q || [e.name,e.category,e.summary,e.id,...e.tags]
                .some(v => v.toLocaleLowerCase().includes(q))
        );

        if (!shown.some(e => e.id === s18GlossaryState.selectedId)) {
            s18GlossaryState.selectedId = shown[0]?.id || null;
        }

        const categories = [...new Set(shown.map(e => e.category))];
        for (const category of categories) {
            const group = document.createElement("div");
            group.className = "groupTitle";
            group.textContent = category;
            list.appendChild(group);

            for (const entry of shown.filter(
                e => e.category === category)) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "leftItem s18-glossary-item" +
                    (entry.id === s18GlossaryState.selectedId ?
                        " active" : "");
                button.textContent = entry.name;
                button.setAttribute("aria-pressed",
                    String(entry.id === s18GlossaryState.selectedId));

                button.addEventListener("click",() => {
                    s18GlossaryState.selectedId = entry.id;
                    draw();
                });

                list.appendChild(button);
            }
        }

        const selected = shown.find(
            e => e.id === s18GlossaryState.selectedId);

        if (!selected) {
            const empty = document.createElement("p");
            empty.textContent = s18GlossaryState.entries.length ?
                "일치하는 용어가 없습니다." :
                "용어집 항목이 없습니다.";
            content.appendChild(empty);
            return;
        }

        const card = document.createElement("section");
        card.className = "card";

        const name = document.createElement("h2");
        name.className = "s18-glossary-name";
        name.textContent = selected.name;
        card.appendChild(name);

        const summary = document.createElement("p");
        summary.className = "s18-glossary-summary";
        summary.textContent = selected.summary;
        card.appendChild(summary);

        for (const paragraph of selected.description) {
            const body = document.createElement("p");
            body.className = "s18-glossary-paragraph";
            body.textContent = paragraph;
            card.appendChild(body);
        }

        if (selected.relatedIds.length) {
            const related = document.createElement("div");
            related.className = "s18-glossary-related";

            for (const id of selected.relatedIds) {
                const target = s18GlossaryState.entries.find(
                    e => e.id === id);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "settingsButton";
                button.textContent = target.name;

                button.addEventListener("click",() => {
                    s18GlossaryState.search = "";
                    s18GlossaryState.selectedId = target.id;
                    renderGlossary();
                });

                related.appendChild(button);
            }

            card.appendChild(related);
        }

        content.appendChild(card);
    }

    search.addEventListener("input",() => {
        s18GlossaryState.search = search.value;
        draw();
    });

    draw();

    if (!s18GlossaryState.loaded) {
        void s18LoadGlossary();
    }
}

    function metrics(surface) {
        const style =
            surface.ownerDocument
                .defaultView
                .getComputedStyle(surface);

        const rect =
            surface.getBoundingClientRect();

        const columns =
            Number(
                surface.dataset.gridColumns) ||
            12;

        const columnGap =
            parseFloat(style.columnGap) || 0;

        const rowGap =
            parseFloat(style.rowGap) || 0;

        const rowHeight =
            parseFloat(
                style.getPropertyValue(
                    "--s18-grid-row")) ||
            44;

        const columnWidth =
            (
                rect.width -
                columnGap * (columns - 1)
            ) / columns;

        return {
            columns,
            columnStep:
                columnWidth + columnGap,
            rowStep:
                rowHeight + rowGap
        };
    }

    function clamp(value,min,max) {
        return Math.max(
            min,
            Math.min(max,value));
    }

    const MAX_EXTRA_ROWS = 4;
    const MIN_AUTHORING_ROWS = 12;

    function prepareBounds(surface) {
        const existing =
            Number(
                surface.dataset.authoringMaxRows);

        if (existing > 0) {
            return existing;
        }

        const blocks =
            Array.from(
                surface.querySelectorAll(
                    ":scope > .gridBlock"));

        let defaultBottom = 0;
        let nodeStart = Infinity;

        blocks.forEach(
            block => {
                const g =
                    geometry(block);

                defaultBottom =
                    Math.max(
                        defaultBottom,
                        g.y + g.h);

                if (
                    block.dataset.gridZone ===
                    "NODE"
                ) {
                    nodeStart =
                        Math.min(
                            nodeStart,
                            g.y);
                }
            });

        if (!Number.isFinite(nodeStart)) {
            nodeStart = 5;
        }

        const maxRows =
            Math.max(
                MIN_AUTHORING_ROWS,
                defaultBottom +
                MAX_EXTRA_ROWS);

        surface.dataset.authoringMaxRows =
            String(maxRows);

        surface.dataset.authoringTitleMaxBottom =
            String(
                Math.min(
                    maxRows,
                    Math.max(
                        2,
                        nodeStart)));

        surface.dataset.authoringSummaryMaxBottom =
            String(
                Math.min(
                    maxRows,
                    Math.max(
                        6,
                        nodeStart + 3)));

        surface.dataset.authoringNodeMinY =
            String(
                Math.max(
                    0,
                    nodeStart - 1));

        return maxRows;
    }

    function zoneBounds(block,surface) {
        const settings =
            readEffectiveGridSettings(surface);

        const zoneName =
            block.dataset.gridZone;

        const zone =
            settings?.zones?.[zoneName];

        if (zone) {
            return {
                minY:Number(zone.start),
                maxBottom:Number(zone.end)
            };
        }

        const maxRows =
            Number(settings?.rows) ||
            prepareBounds(surface);

        return {
            minY:0,
            maxBottom:maxRows
        };
    }
    function constrainToBounds(
        block,
        value,
        surface)
    {
        const gridMetrics =
            metrics(surface);

        const bounds =
            zoneBounds(
                block,
                surface);

        let x =
            Math.round(Number(value.x));

        let y =
            Math.round(Number(value.y));

        let w =
            Math.max(
                1,
                Math.round(Number(value.w)));

        const minimumHeight = 1;

        let h =
            Math.max(
                minimumHeight,
                Math.round(Number(value.h)));

        if (
            block.dataset.resizePolicy ===
            "aspect-locked"
        ) {
            let size =
                Math.max(w,h);

            const maxZoneSize =
                Math.max(
                    1,
                    bounds.maxBottom -
                    bounds.minY);

            size =
                Math.max(
                    1,
                    Math.min(
                        size,
                        gridMetrics.columns,
                        maxZoneSize));

            x =
                clamp(
                    x,
                    0,
                    gridMetrics.columns -
                    size);

            y =
                clamp(
                    y,
                    bounds.minY,
                    bounds.maxBottom -
                    size);

            return {
                x:x,
                y:y,
                w:size,
                h:size
            };
        }

        x =
            clamp(
                x,
                0,
                gridMetrics.columns - 1);

        y =
            clamp(
                y,
                bounds.minY,
                bounds.maxBottom - 1);

        w =
            clamp(
                w,
                1,
                gridMetrics.columns - x);

        h =
            clamp(
                h,
                minimumHeight,
                bounds.maxBottom - y);

        return {
            x:x,
            y:y,
            w:w,
            h:h
        };
    }

    function overlaps(a,b) {
        return (
            a.x < b.x + b.w &&
            a.x + a.w > b.x &&
            a.y < b.y + b.h &&
            a.y + a.h > b.y
        );
    }

    function collides(
        block,
        candidate,
        surface)
    {
        return Array.from(
            surface.querySelectorAll(
                ":scope > .gridBlock"))
            .some(other => {
                if (other === block) {
                    return false;
                }

                return overlaps(
                    candidate,
                    geometry(other));
            });
    }
    // S18 B2-B: immutable per-surface defaults, not the last edited zone coordinates.
    const s18InitialGridSettings = new WeakMap();
    function defaultGridSettings(surface) {
        const savedInitial=surface.dataset.profileInitialGrid;
        if(savedInitial)return JSON.parse(savedInitial);
        const known = s18InitialGridSettings.get(surface);
        if (known) return JSON.parse(JSON.stringify(known));
        captureZoneGuideDefaults(surface);
        const data = surface.dataset;
        const value = (name,fallback) => {
            const n = Number(data[name]);
            return Number.isFinite(n) ? n : fallback;
        };
        const columns = value("gridColumns",12) || 12;
        const rows = value("authoringGuideMaxRows",
            value("authoringMaxRows",12)) || 12;
        const initial = {
            columns, rows,
            zones:{
                TITLE:{
                    start:value("authoringGuideTitleStart",0),
                    end:value("authoringGuideTitleEnd",2)
                },
                SUMMARY:{
                    start:value("authoringGuideSummaryStart",2),
                    end:value("authoringGuideSummaryEnd",4)
                },
                NODE:{
                    start:value("authoringGuideNodeStart",5),
                    end:rows
                }
            }
        };
        s18InitialGridSettings.set(surface,initial);
        surface.dataset.profileInitialGrid=JSON.stringify(initial);
        return JSON.parse(JSON.stringify(initial));
    }
    function normalizeGridSettings(value,fallback) {
        const source = value && typeof value === "object" ? value : fallback;
        const finite = (v,def) => Number.isFinite(Number(v)) ? Math.round(Number(v)) : def;
        const columns = clamp(finite(source.columns,fallback.columns),4,24);
        const rows = clamp(finite(source.rows,fallback.rows),6,40);
        const supplied = source.zones || {};
        const zone = (key) => supplied[key] || fallback.zones[key];
        const title = zone("TITLE");
        const summary = zone("SUMMARY");
        const node = zone("NODE");
        const titleStart = clamp(finite(title.start,fallback.zones.TITLE.start),0,rows - 3);
        const titleEnd = clamp(finite(title.end,fallback.zones.TITLE.end),titleStart + 1,rows - 2);
        const summaryStart = clamp(finite(summary.start,fallback.zones.SUMMARY.start),titleEnd,rows - 2);
        const summaryEnd = clamp(finite(summary.end,fallback.zones.SUMMARY.end),summaryStart + 1,rows - 1);
        const nodeStart = clamp(finite(node.start,fallback.zones.NODE.start),summaryEnd,rows - 1);
        const nodeEnd = clamp(finite(node.end,rows),nodeStart + 1,rows);
        return {
            columns, rows,
            zones:{
                TITLE:{start:titleStart,end:titleEnd},
                SUMMARY:{start:summaryStart,end:summaryEnd},
                NODE:{start:nodeStart,end:nodeEnd}
            }
        };
    }
    function readEffectiveGridSettings(
        surface)
    {
        const fallback =
            defaultGridSettings(
                surface);

        const layout =
            readLayout();

        return normalizeGridSettings(
            layout.grid,
            fallback);
    }

    function applyGridSettings(
        surface,
        settings)
    {
        const normalized =
            normalizeGridSettings(
                settings,
                defaultGridSettings(
                    surface));

        const title =
            normalized.zones.TITLE;

        const summary =
            normalized.zones.SUMMARY;

        const node =
            normalized.zones.NODE;

        surface.dataset.gridColumns =
            String(
                normalized.columns);

        surface.style.setProperty(
            "--s18-grid-columns",
            String(
                normalized.columns));

        surface.style.gridTemplateRows =
            `repeat(${normalized.rows}, var(--s18-grid-row))`;

        surface.dataset.authoringMaxRows =
            String(
                normalized.rows);

        surface.dataset.authoringTitleMinY =
            String(
                title.start);

        surface.dataset.authoringTitleMaxBottom =
            String(
                title.end);

        surface.dataset.authoringSummaryMinY =
            String(
                summary.start);

        surface.dataset.authoringSummaryMaxBottom =
            String(
                summary.end);

        surface.dataset.authoringNodeMinY =
            String(
                node.start);

        surface.dataset.authoringNodeMaxBottom =
            String(
                node.end);

        surface.dataset.authoringGuideTitleStart =
            String(
                title.start);

        surface.dataset.authoringGuideTitleEnd =
            String(
                title.end);

        surface.dataset.authoringGuideSummaryStart =
            String(
                summary.start);

        surface.dataset.authoringGuideSummaryEnd =
            String(
                summary.end);

        surface.dataset.authoringGuideNodeStart =
            String(
                node.start);

        surface.dataset.authoringGuideMaxRows =
            String(
                normalized.rows);

        return normalized;
    }

    // B2-B: stage a complete layout, then commit display and storage together.
    function commitGridSettings(doc,settings) {
        const surface = currentSurface(doc);
        if (!surface || !canCenterEdit()) return false;
        const current = readLayout();
        if (!current || typeof current !== "object" || Array.isArray(current) ||
            !current.global || typeof current.global !== "object" ||
            !current.classes || typeof current.classes !== "object") return false;

        const proposed = JSON.parse(JSON.stringify(current));
        const classId = surface.dataset.classId || "0";
        proposed.classes[classId] ??= {};
        for (const block of currentBlocks(doc)) {
            const key = block.dataset.blockKey || "";
            if (!key) return false;
            const g = geometry(block);
            if (![g.x,g.y,g.w,g.h].every(Number.isFinite)) return false;
            if (key.startsWith("node.")) proposed.classes[classId][key] = g;
            else proposed.global[key] = g;
        }
        proposed.grid = settings;
        const plan = planWorking(doc,proposed);
        if (!plan) return false;
        const same = (a,b) => Number(a) === Number(b);
        if (!same(plan.settings.columns,settings.columns) ||
            !same(plan.settings.rows,settings.rows)) return false;
        for (const zone of ["TITLE","SUMMARY","NODE"]) {
            if (!same(plan.settings.zones[zone].start,settings.zones[zone].start) ||
                !same(plan.settings.zones[zone].end,settings.zones[zone].end)) return false;
        }

        for (const entry of plan.planned) {
            const key = entry.block.dataset.blockKey;
            if (key.startsWith("node.")) proposed.classes[classId][key] = entry.g;
            else proposed.global[key] = entry.g;
        }
        const priorRaw = localStorage.getItem(WORKING_KEY);
        const priorGrid = readEffectiveGridSettings(surface);
        const priorBlocks = currentBlocks(doc).map(block => ({block,g:geometry(block)}));

        // Coordinates were already validated by planWorking; bypass the
        // constraint helper, which still reads the OLD stored grid.
        function assign(block,g) {
            block.dataset.gridX = String(g.x);
            block.dataset.gridY = String(g.y);
            block.dataset.gridW = String(g.w);
            block.dataset.gridH = String(g.h);
            block.style.gridColumn = `${g.x + 1} / span ${g.w}`;
            block.style.gridRow = `${g.y + 1} / span ${g.h}`;
            syncSummaryPresentation(block,g);
        }
        try {
            applyGridSettings(surface,plan.settings);
            plan.planned.forEach(entry => assign(entry.block,entry.g));
            writeLayout(proposed);
            updateZoneGuides(doc);
            return true;
        } catch (error) {
            try {
                if (localStorage.getItem(WORKING_KEY) !== priorRaw) {
                    if (priorRaw === null) localStorage.removeItem(WORKING_KEY);
                    else localStorage.setItem(WORKING_KEY,priorRaw);
                }
            } catch (_) { console.warn("[S18Grid] Storage rollback failed"); }
            applyGridSettings(surface,priorGrid);
            priorBlocks.forEach(entry => assign(entry.block,entry.g));
            updateZoneGuides(doc);
            console.warn("[S18Grid][REJECT] Grid transaction rolled back",error);
            return false;
        }
    }
    let zoneDragState = null;

    function zoneBlockExtent(
        surface,
        zoneName)
    {
        const blocks =
            Array.from(
                surface.querySelectorAll(
                    ":scope > .gridBlock"))
                .filter(
                    block =>
                        block.dataset.gridZone ===
                        zoneName);

        if (!blocks.length) {
            return {
                minTop:Infinity,
                maxBottom:0

        }

        return {
            minTop:
                Math.min(
                    ...blocks.map(
                        block =>
                            geometry(block).y)),

            maxBottom:
                Math.max(
                    ...blocks.map(
                        block => {
                            const g =
                                geometry(block);

                            return g.y +
                                g.h;
                        }))
        };
    }

    function beginZoneBoundaryDrag(

        if (!handle) {

        const surface =
            currentSurface(doc);

        if (!surface) {

        const settings =

        const boundary =
            handle.dataset.boundary;

        if (!boundary) {
            return false;
        }

        let startRow = 0;

        if (
            boundary ===
            "title-summary"
        ) {
            startRow =
                settings.zones.TITLE.end;

        } else if (
            boundary ===
            "summary-node"
        ) {
            startRow =
                settings.zones.SUMMARY.end;

        } else if (
            boundary ===
            "bottom"
        ) {
            startRow =
                settings.rows;

        } else {
            return false;
        }

        zoneDragState = {
            doc:doc,
            surface:surface,
            boundary:boundary,

            startClientY:
                event.clientY,

            startRow:startRow,
            lastRow:startRow,

            settings:
                JSON.parse(
                    JSON.stringify(
                        settings)),

            rowStep:
                metrics(surface).rowStep
        };

        event.preventDefault();
        event.stopPropagation();

        return true;
    }

    function moveZoneBoundaryDrag(event) {
        if (!zoneDragState) return;
        event.preventDefault();
        const state = zoneDragState;
        const delta = Math.round((event.clientY-state.startClientY)/state.rowStep);
        const settings = JSON.parse(JSON.stringify(state.settings));
        let requested = state.startRow + delta;

        if (state.boundary === "title-summary") {
            const gap = Math.max(0,
                settings.zones.SUMMARY.start -
                settings.zones.TITLE.end);
            requested = clamp(requested,
                settings.zones.TITLE.start+1,
                settings.zones.SUMMARY.end-1-gap);
            settings.zones.TITLE.end = requested;
            settings.zones.SUMMARY.start = requested+gap;
        } else if (state.boundary === "summary-node") {
            const gap = Math.max(0,
                settings.zones.NODE.start -
                settings.zones.SUMMARY.end);
            requested = clamp(requested,
                settings.zones.SUMMARY.start+1,
                settings.zones.NODE.end-1-gap);
            settings.zones.SUMMARY.end = requested;
            settings.zones.NODE.start = requested+gap;
        } else if (state.boundary === "bottom") {
            requested = clamp(requested,settings.zones.NODE.start+1,40);
            settings.rows = requested;
            settings.zones.NODE.end = requested;
        } else return;

        if (requested === state.lastRow) return;
        if (!commitGridSettings(state.doc,settings)) {
            editorStatus.textContent = "경계 변경 불가 — 기존 배치 유지";
            return;
        }
        state.lastRow = requested;
        const labels = {
            "title-summary":"칭호/상태 경계",
            "summary-node":"상태/노드 경계",
            bottom:"전체 하단"
        };
        editorStatus.textContent = `${labels[state.boundary]} → ROW ${
            state.boundary === "bottom" ? requested-1 : requested}`;
    }
    function endZoneBoundaryDrag() {
        zoneDragState =
            null;
    }
    function beginPointer(event,doc) {
        if (!canCenterEdit() || event.target.closest(".title-edit-entry, #titleInternalModal")) return;
        if (!editEnabled) {
            return;
        }

        if (
            event.target.closest(
                ".tull-zone-boundary-handle")
        ) {
            return;
        }

        const block =
            event.target.closest(
                ".centerGridSurface > .gridBlock");

        if (!block) {
            return;
        }

        const surface =
            block.closest(
                ".centerGridSurface");

        const edgeHandle =
            event.target.closest(
                ".tull-edge-resize");

        const cornerHandle =
            event.target.closest(
                ".tull-resize-handle");

        let resizeMode =
            "move";

        if (edgeHandle) {
            if (
                block.dataset
                    .resizePolicy !==
                "free"
            ) {
                return;
            }

            resizeMode =
                edgeHandle.dataset.edge;

        } else if (cornerHandle) {
            resizeMode =
                "corner";
        }

        event.preventDefault();
        event.stopPropagation();

        dragState = {
            block:block,
            surface:surface,
            resizeMode:resizeMode,

            startClientX:
                event.clientX,

            startClientY:
                event.clientY,

            start:
                geometry(block),

            metrics:
                metrics(surface)
        };
    }
    function movePointer(event) {
        if (!canCenterEdit()) { dragState = null; return; }
        if (!dragState) {
            return;
        }

        event.preventDefault();

        const state =
            dragState;

        const dx =
            Math.round(
                (
                    event.clientX -
                    state.startClientX
                ) /
                state.metrics.columnStep);

        const dy =
            Math.round(
                (
                    event.clientY -
                    state.startClientY
                ) /
                state.metrics.rowStep);

        const mode =
            state.resizeMode;

        let candidate = {
            ...state.start
        };

        if (mode === "move") {
            candidate.x =
                state.start.x +
                dx;

            candidate.y =
                state.start.y +
                dy;

            candidate =
                constrainToBounds(
                    state.block,
                    candidate,
                    state.surface);

        } else if (
            mode === "corner"
        ) {
            const policy =
                state.block.dataset
                    .resizePolicy;

            if (
                policy ===
                "aspect-locked"
            ) {
                const step =
                    Math.abs(dx) >=
                    Math.abs(dy) ?
                        dx :
                        dy;

                const size =
                    Math.max(
                        1,
                        state.start.w +
                        step);

                candidate.w =
                    size;

                candidate.h =
                    size;

            } else {
                candidate.w =
                    Math.max(
                        1,
                        state.start.w +
                        dx);

                candidate.h =
                    Math.max(
                        1,
                        state.start.h +
                        dy);
            }

            candidate =
                constrainToBounds(
                    state.block,
                    candidate,
                    state.surface);

        } else {
            const bounds =
                zoneBounds(
                    state.block,
                    state.surface);

            if (mode === "top") {
                const bottom =
                    state.start.y +
                    state.start.h;

                const nextY =
                    clamp(
                        state.start.y +
                        dy,
                        bounds.minY,
                        bottom - 1);

                candidate.y =
                    nextY;

                candidate.h =
                    bottom -
                    nextY;

            } else if (
                mode === "bottom"
            ) {
                const nextBottom =
                    clamp(
                        state.start.y +
                        state.start.h +
                        dy,
                        state.start.y + 1,
                        bounds.maxBottom);

                candidate.h =
                    nextBottom -
                    state.start.y;

            } else if (
                mode === "left"
            ) {
                const right =
                    state.start.x +
                    state.start.w;

                const nextX =
                    clamp(
                        state.start.x +
                        dx,
                        0,
                        right - 1);

                candidate.x =
                    nextX;

                candidate.w =
                    right -
                    nextX;

            } else if (
                mode === "right"
            ) {
                const nextRight =
                    clamp(
                        state.start.x +
                        state.start.w +
                        dx,
                        state.start.x + 1,
                        state.metrics.columns);

                candidate.w =
                    nextRight -
                    state.start.x;
            }
        }

        if (
            collides(
                state.block,
                candidate,
                state.surface)
        ) {
            editorStatus.textContent =
                "충돌 제한";

            return;
        }

        applyGeometry(
            state.block,
            candidate);

        editorStatus.textContent =
            `${candidate.x},${candidate.y} · ` +
            `${candidate.w}×${candidate.h}`;
    }
    function endPointer() {
        if (!dragState) {
            return;
        }

        saveBlock(
            dragState.block);

        dragState = null;
    }

    function bindFrame(doc) {
        if (
            doc.documentElement.dataset
                .tullAuthoringBound === "1"
        ) {
            return;
        }

        doc.documentElement.dataset
            .tullAuthoringBound =
            "1";

        doc.addEventListener(
            "pointerdown",
            event => {
                if (
                    beginZoneBoundaryDrag(
                        event,
                        doc)
                ) {
                    return;
                }

                beginPointer(
                    event,
                    doc);
            },
            true);

        doc.addEventListener(
            "pointermove",
            event => {
                if (zoneDragState) {
                    moveZoneBoundaryDrag(
                        event);

                    return;
                }

                movePointer(
                    event);
            },
            true);

        doc.addEventListener(
            "pointerup",
            () => {
                if (zoneDragState) {
                    endZoneBoundaryDrag();
                    return;
                }

                endPointer();
            },
            true);

        doc.addEventListener(
            "pointercancel",
            () => {
                if (zoneDragState) {
                    endZoneBoundaryDrag();
                    return;
                }

                endPointer();
            },
            true);

        doc.addEventListener(
            "click",
            event => {
                if (!canCenterEdit() || event.target.closest(".title-edit-entry, #titleInternalModal")) return;
                if (!editEnabled) {
                    return;
                }

                if (
                    event.target.closest(
                        ".centerGridSurface > .gridBlock") ||
                    event.target.closest(
                        ".tull-zone-boundary-handle")
                ) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                }
            },
            true);
    }
    function frameReady() {
        const doc =
            mainFrame.contentDocument;

        const frameWindow =
            mainFrame.contentWindow;

        if (!doc || !frameWindow) {
            return;
        }

        bindFrame(doc);

        frameWindow.addEventListener(
            "tull-grid-ready",
            function () {
                window.setTimeout(
                    () =>
                        applyWorking(
                            mainFrame.contentDocument),
                    0);
            });

        applyWorking(doc);
    }

    function setEdit(next) {
        editEnabled = Boolean(next) && canCenterEdit();

        localStorage.setItem(
            EDIT_KEY,

        editButton.textContent =
            editEnabled ?

        editButton.setAttribute(

        }

    function savePreset(slot) {
        if (!canCenterEdit()) return;
        const doc =
            mainFrame.contentDocument;

        if (doc) {
            captureCurrent(doc);
        }

        const layout =
            readLayout();

        writeLayout(
            layout,
            presetKey(slot));

        editorStatus.textContent =
            "";
    }

    function loadPreset(slot) {
        if (!canCenterEdit()) return;
        const raw = localStorage.getItem(presetKey(slot));
        if (!raw) {
            editorStatus.textContent = `P${slot} 비어 있음`;
            return;
        }

        let candidate;
        try {
            candidate = JSON.parse(raw);
        } catch (_) {
            editorStatus.textContent = `P${slot} 데이터 손상 — 현재 배치 유지`;
            return;
        }

        const doc = mainFrame.contentDocument;
        if (!doc || !planWorking(doc,candidate)) {
            editorStatus.textContent = `P${slot} 배치 불가 — 현재 배치 유지`;
            return;
        }

        const previous = localStorage.getItem(WORKING_KEY);
        try {
            writeLayout(candidate);
            if (!applyWorking(doc)) throw new Error("Preset apply failed");
            editorStatus.textContent = "";
        } catch (_) {
            if (previous === null) localStorage.removeItem(WORKING_KEY);
            else localStorage.setItem(WORKING_KEY,previous);
            applyWorking(doc);
            editorStatus.textContent = `P${slot} 적용 실패 — 기존 배치 복구`;
        }
    }
    function resetCurrent() {
        if (!canCenterEdit()) return;
        const doc =
            mainFrame.contentDocument;

        if (!doc) {
            return;
        }

        const surface =
            currentSurface(doc);

        if (!surface) {
            return;
        }

        const classId =
            surface.dataset.classId || "0";

        const layout =
            readLayout();

        delete layout.classes[classId];

        currentBlocks(doc)
            .filter(
                block =>
                    !String(
                        block.dataset.blockKey || "")
                        .startsWith("node."))
            .forEach(
                block =>
                    delete layout.global[
                        block.dataset.blockKey]);

        writeLayout(layout);

        if (typeof renderHome === "function") {
            renderHome();
        }

        editorStatus.textContent = "";
    }

            settings.zones.SUMMARY.start);

            settings.zones.SUMMARY.end - 1);

        set(

            settings.zones.NODE.start);

        set(
            "data-node-end",
            settings.zones.NODE.end - 1);
    }

        "inline-flex";

    controls.style.gap =
        "6px";

    controls.style.alignItems =
        "center";

    const editButton =
        document.createElement("button");

    editButton.id =
        "layoutEditButton";

    editButton.type =
        "button";

    editButton.addEventListener(
        "click",
        () =>
            setEdit(
                !editEnabled));

    const gridSettingsButton =
        document.createElement("button");

    gridSettingsButton.type =
        "button";

    gridSettingsButton.textContent =
        "영역 설정";

    gridSettingsButton.addEventListener(
        "click",
        openGridSettings);
    const presetSelect =
        document.createElement("select");

    presetSelect.id =
        "layoutPresetSelect";

    [1,2,3].forEach(
        slot => {

                document.createElement(
                    "option");

                `중앙 배치 ${slot}`;

            presetSelect.appendChild(
                option);
        });

    const saveButton =
        document.createElement("button");

    saveButton.id = "centerSaveButton";
    saveButton.type =
        "button";

    saveButton.textContent =
        "배치 저장";

    saveButton.addEventListener(
        "click",
        () =>
            savePreset(
                presetSelect.value));

    const loadButton =
        document.createElement("button");

    loadButton.id = "centerLoadButton";
    loadButton.type =
        "button";

    loadButton.textContent =
        "배치 불러오기";

    loadButton.addEventListener(
        "click",

    const resetButton =
        document.createElement("button");

    resetButton.id = "centerResetButton";
    resetButton.type =
        "button";

    resetButton.textContent =

    if (snapshotStatus) {
