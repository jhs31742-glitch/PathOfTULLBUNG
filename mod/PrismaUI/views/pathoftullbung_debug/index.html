        toolbar.appendChild(
            controls);
    }

    const productionTopbar =
        document.getElementById("topbar");

    const productionClose =
        document.getElementById("closeButton");

    let productionBar = null;
    let productionPresetButtons = [];
    let productionSelectedSlot = 1;
    let productionEditButton = null;
    let productionLoadButton = null;
    let productionStatus = null;

    function selectedProductionPreset() {
        const value =
            Number(productionSelectedSlot);

        return Number.isInteger(value) &&
            value >= 1 &&
            value <= 3 ?
                value :
                1;
    }

    function syncProductionBar() {
        if (!productionBar ||
            !productionClose ||
            !productionTopbar) {

            return;
        }

        const allowed =
            canCenterEdit();

        if (!allowed &&
            editEnabled) {

            setEdit(false);
        }

        const headerBox =
            productionTopbar
                .getBoundingClientRect();

        const closeBox =
            productionClose
                .getBoundingClientRect();

        productionBar.style.right =
            `${headerBox.right -
               closeBox.left +
               6}px`;

        productionBar.hidden =
            !allowed;

        productionBar.style.display =
            allowed ?
                "flex" :
                "none";

        productionEditButton.textContent =
            `중앙 편집 ${editEnabled ?
                "ON" :
                "OFF"}`;

        productionEditButton.style.background =
            editEnabled ?
                "var(--card-hover-bg)" :
                "var(--card-bg)";

        productionPresetButtons.forEach(button => {
            const slot = Number(button.dataset.presetSlot);
            const saved = localStorage.getItem(presetKey(slot)) !== null;
            const selected = slot === selectedProductionPreset();
            button.classList.toggle("is-saved",saved);
            button.classList.toggle("is-selected",selected);
            button.setAttribute("aria-pressed",String(selected));
            button.setAttribute("aria-label",`중앙 프리셋 ${slot} · ${saved ? "저장됨" : "비어 있음"}`);
            button.disabled = !allowed;
        });
        const selectedSaved = localStorage.getItem(
            presetKey(selectedProductionPreset())) !== null;

        productionLoadButton.disabled =
            !allowed ||
            !selectedSaved;

        if (productionStatus) {

            productionStatus.textContent =
                editorStatus.textContent ||
                "";
        }
    }

    function productionButton(
        label,
        action)
    {
        const button =
            document.createElement(
                "button");

        button.type =
            "button";

        button.textContent =
            label;

        button.classList.add("s18-center-action-button");

        button.style.fontSize =
            "11px";

        button.style.minHeight =
            "26px";

        button.style.padding =
            "3px 7px";

        button.addEventListener(
            "click",
            action);

        productionBar.appendChild(
            button);

        return button;
    }

    function installProductionBar() {
        if (!productionTopbar ||
            !productionClose ||
            document.getElementById(
                "tull-center-authoring-toolbar")) {

            return;
        }

        if (
            getComputedStyle(
                productionTopbar
            ).position === "static"
        ) {
            productionTopbar.style.position =
                "relative";
        }

        productionBar =
            document.createElement(
                "div");

        productionBar.id =
            "tull-center-authoring-toolbar";

        productionBar.style.cssText =
            "position:absolute;" +
            "right:0;" +
            "top:50%;" +
            "transform:translateY(-50%);" +
            "align-items:center;" +
            "gap:5px;" +
            "z-index:5000;" +
            "white-space:nowrap";

        const badge =
            document.createElement(
                "strong");

        badge.textContent =
            "개발자모드";

        badge.style.cssText =
            "font-size:11px;" +
            "padding:3px 6px;" +
            "background:var(--card-bg);" +
            "color:var(--ink);" +
            "border:1px solid var(--card-line)";

        productionBar.appendChild(
            badge);

        productionEditButton =
            productionButton(
                "중앙 편집 OFF",
                () => {
                    if (!canCenterEdit()) {
                        return;
                    }

                    setEdit(
                        !editEnabled);

                    syncProductionBar();
                });

        productionEditButton.id =
            "centerEditButton";

        const presetGroup = document.createElement("span");
        presetGroup.className = "s18-center-preset-group";
        presetGroup.setAttribute("role","group");
        presetGroup.setAttribute("aria-label","중앙 배치 프리셋");
        [1,2,3].forEach(slot => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "s18-center-preset-slot";
            button.dataset.presetSlot = String(slot);
            button.textContent = String(slot);
            button.addEventListener("click",() => {
                productionSelectedSlot = slot;
                editorStatus.textContent = "";
                syncProductionBar();
            });
            presetGroup.appendChild(button);
            productionPresetButtons.push(button);
        });
        productionBar.appendChild(presetGroup);

        productionButton(
            "저장",
            () => {
                if (!canCenterEdit()) {
                    return;
                }

                savePreset(
                    selectedProductionPreset());

                syncProductionBar();
            }).id =
                "centerSaveButton";

        productionLoadButton =
            productionButton(
                "불러오기",
                () => {
                    if (!canCenterEdit()) {
                        return;
                    }

                    loadPreset(
                        selectedProductionPreset());

                    syncProductionBar();
                });

        productionLoadButton.id =
            "centerLoadButton";

        productionButton(
            "초기화",
            () => {
                if (!canCenterEdit()) {
                    return;
                }

                resetCurrent();

                syncProductionBar();
            }).id =
                "centerResetButton";

        productionStatus =
            document.createElement(
                "span");

        productionStatus.style.cssText =
            "font-size:11px;" +
            "opacity:.75";

        productionBar.appendChild(
            productionStatus);

        productionTopbar.appendChild(
            productionBar);

        syncProductionBar();
    }

    window.addEventListener(
        "tull-grid-ready",
        syncProductionBar);

    window.addEventListener(
        "resize",
        syncProductionBar);

    document
        .querySelectorAll(
            ".tab")
        .forEach(
            tab =>
                tab.addEventListener(
                    "click",
                    () =>
                        window.setTimeout(
                            syncProductionBar,
                            0)));

    const previousReceive =
        window.tullReceive;

    if (
        typeof previousReceive ===
        "function"
    ) {
        window.tullReceive =
            function(payload) {

                const result =
                    previousReceive.apply(
                        this,
                        arguments);

                let message =
                    payload;

                try {
                    if (
                        typeof payload ===
                        "string"
                    ) {
                        message =
                            JSON.parse(
                                payload);
                    }
                }
                catch (_) {
                    message = null;
                }

                if (
                    message &&
                    message.kind ===
                        "settings"
                ) {
                    syncProductionBar();
                }

                return result;
            };
    }

    installProductionBar();
    mainFrame.addEventListener(
        "load",
        frameReady);

    let profileSurface=null;
    const profileDoc=()=>{const live=currentSurface(document),surface=live||profileSurface;if(!surface)return null;return {querySelector:s=>s==='.centerGridSurface'?surface:surface.querySelector(s),querySelectorAll:s=>s==='.centerGridSurface > .gridBlock'?surface.querySelectorAll(':scope > .gridBlock'):surface.querySelectorAll(s)};};
    const profileGeometry=()=>{const d=profileDoc();return d?currentBlocks(d).map(b=>({key:b.dataset.blockKey,g:geometry(b)})):[];};
    window.TULLProfileOwners.center={
      defaults:()=>{const layout=emptyLayout(),d=profileDoc();if(!d)throw Error('central-default-surface-unavailable');const surface=currentSurface(d);layout.grid=defaultGridSettings(surface);const classID=surface.dataset.classId||'0';layout.classes[classID]={};for(const b of currentBlocks(d)){const raw=b.dataset.profileInitialGeometry;if(!raw)throw Error('central-initial-geometry-unavailable');const g=JSON.parse(raw),key=b.dataset.blockKey;if(key.startsWith('node.'))layout.classes[classID][key]=g;else layout.global[key]=g;}return layout;},
      capture:()=>({geometry:profileGeometry(),grid:window.TULLProfileOwners.center.currentGrid(),editEnabled}),busy:()=>!!dragState||!!zoneDragState||editEnabled,
      currentGrid:()=>{const d=profileDoc();if(!d)return null;return readEffectiveGridSettings(currentSurface(d));},
      preflight:raw=>{const layout=JSON.parse(raw),d=profileDoc();if(!d)throw Error('central-owner-surface-unavailable');const plan=planWorking(d,layout);if(!plan)throw Error('central-plan-rejected');const classId=currentSurface(d).dataset.classId||'0';for(const e of plan.planned){const key=e.block.dataset.blockKey,saved=key.startsWith('node.')?layout.classes[classId]?.[key]:layout.global[key];const expected=saved||geometry(e.block);if(['x','y','w','h'].some(k=>expected[k]!==e.g[k]))throw Error('central-relocation-or-shrink');}if(layout.grid&&JSON.stringify(layout.grid)!==JSON.stringify(plan.settings))throw Error('central-grid-normalization');return plan;},
      apply:()=>{const raw=localStorage.getItem(WORKING_KEY);if(!raw)return;const plan=window.TULLProfileOwners.center.preflight(raw);const d=profileDoc();applyGridSettings(currentSurface(d),plan.settings);for(const e of plan.planned)applyGeometry(e.block,e.g);},
      restore:s=>{const d=profileDoc();if(!d){if(s.geometry.length)throw Error('central-restore-surface');return;}if(s.grid)applyGridSettings(currentSurface(d),s.grid);for(const item of s.geometry){const b=currentBlocks(d).find(x=>x.dataset.blockKey===item.key);if(!b)throw Error('central-restore-block');applyGeometry(b,item.g);}},
      verify:raw=>{if(raw===null)return true;const plan=window.TULLProfileOwners.center.preflight(raw);return plan.planned.every(e=>JSON.stringify(geometry(e.block))===JSON.stringify(e.g));}
    };
    const profileRemember=()=>{const surface=currentSurface(document);if(surface)profileSurface=surface.cloneNode(true);};
    const profilePreviousRender=render;render=function(...args){profileRemember();return profilePreviousRender.apply(this,args);};
    profileRemember();new MutationObserver(()=>profileRemember()).observe(document.getElementById('centerPanel'),{childList:true,subtree:true});

    window.TULLCenterAuthoring = {
        setEdit,
        cancel() { dragState = null; zoneDragState = null; }
    };
    setEdit(editEnabled);

    if (mainFrame.contentDocument &&
        mainFrame.contentDocument.readyState ===
            "complete") {

        frameReady();
    }
})();
</script>






<script id="s18-user-theme-palette">
(() => {
    'use strict';
    if (window.TULLCustomPaletteV1) return;

    const key = 'tull.ui.customPalette.v1';
    const fields = [
        ['surface', '전체 색조'],
        ['text', '일반 글씨'],
        ['muted', '보조 글씨'],
        ['accent', '강조 색상'],
        ['border', '테두리']
    ];
    const initial = Object.freeze({
        surface:'#D7C49B', text:'#2A2116', muted:'#746249',
        accent:'#B67B20', border:'#59472E'
    });
    const mabinogi = Object.freeze({
        surface:'#56A8D8',
        text:'#F7FCFF',
        muted:'#D7F1FF',
        accent:'#8FE9FF',
        border:'#2F6F9C'
    });
    const validColor = v =>
        typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v);

    const colorSet = value =>
        Object.fromEntries(fields.map(([name]) => [
            name,
            validColor(value?.[name]) ?
                value[name].toUpperCase() : initial[name]
        ]));

    const copy = value => ({...value});
    const state = {
        active:false,
        mabinogi:false,
        working:copy(initial),
        selected:1,
        slots:[null,null,null]
    };

    try {
        const stored = JSON.parse(
            localStorage.getItem(key) || 'null'
        );
        if (stored?.version === 1) {
            state.active = stored.active === true;
            state.mabinogi = stored.mabinogi === true && !state.active;
            state.working = colorSet(stored.working);
            if (Number.isInteger(stored.selected) &&
                stored.selected >= 1 && stored.selected <= 3)
                state.selected = stored.selected;

            if (Array.isArray(stored.slots)) {
                state.slots = [0,1,2].map(i =>
                    stored.slots[i] &&
                    fields.every(([name]) =>
                        validColor(stored.slots[i][name])) ?
                        colorSet(stored.slots[i]) : null
                );
            }
        }
    } catch (_) {
        // Missing/corrupt storage uses safe defaults.
    }

    function store() {
        try {
            localStorage.setItem(key, JSON.stringify({
                version:1,
                active:state.active,
                mabinogi:state.mabinogi,
                working:state.working,
                selected:state.selected,
                slots:state.slots
            }));
            return true;
        } catch (_) {
            return false;
        }
    }

    function rgb(hex) {
        return [1,3,5].map(i =>
            parseInt(hex.slice(i,i+2),16));
    }

    function blended(a,b,f) {
        const aa=rgb(a), bb=rgb(b);
        return aa.map((v,i) =>
            Math.round(v*(1-f)+bb[i]*f));
    }

    function cssRGBA(tuple,alpha) {
        return `rgba(${tuple.join(',')},${
            Math.max(0,Math.min(1,alpha)).toFixed(3)
        })`;
    }

    function contrast(a,b) {
        const light = c => rgb(c).map(v => {
            const x=v/255;
            return x<=0.04045 ?
                x/12.92 : ((x+0.055)/1.055)**2.4;
        }).reduce((sum,v,i) =>
            sum+v*[0.2126,0.7152,0.0722][i],0);

        const x=light(a), y=light(b);
        return (Math.max(x,y)+0.05)/
               (Math.min(x,y)+0.05);
    }

    function paint() {
        if ((!state.active && !state.mabinogi) ||
            typeof settingsState === 'undefined' ||
            !settingsState) return;

        const root = document.documentElement;
        const v = state.mabinogi ? mabinogi : state.working;

        root.style.setProperty('--ink',v.text);
        root.style.setProperty('--muted',v.muted);
        root.style.setProperty('--gold',v.accent);
        root.style.setProperty('--line',v.border);
        root.style.setProperty(
            '--paper',cssRGBA(rgb(v.surface),.90));
        root.style.setProperty(
            '--paper2',
            cssRGBA(blended(v.surface,'#FFFFFF',.08),.92));
        root.style.setProperty(
            '--paper3',
            cssRGBA(blended(v.surface,v.accent,.33),.83));

        const opacity = Math.max(0,Math.min(1,
            Number(settingsState.uiBackgroundOpacity) || 0));

        const backgrounds = [
            ['--shell-bg',0,.90],
            ['--topbar-bg',.07,.91],
            ['--left-bg',.09,.77],
            ['--center-bg',0,.69],
            ['--right-bg',.10,.84],
            ['--title-bg',.14,.28],
            ['--summary-bg',.12,.35],
            ['--node-section-bg',.08,.18],
            ['--description-bg',.16,.46],
            ['--notice-bg',.04,.12],
            ['--footer-bg',.05,.68],
            ['--card-bg',.15,.43],
            ['--card-hover-bg',.25,.72]
        ];

        for(const [token,mix,alpha] of backgrounds) {
            const main = [
                '--shell-bg','--topbar-bg','--left-bg',
                '--center-bg','--right-bg','--footer-bg'
            ].includes(token);

            const floor = Math.min(
                alpha,main ? .43 : .18
            );
            const finalAlpha =
                floor+(alpha-floor)*opacity;

            const color =
                token==='--card-hover-bg' ?
                    blended(v.surface,v.accent,mix) :
                    blended(v.surface,'#FFFFFF',mix);

            root.style.setProperty(
                token,cssRGBA(color,finalAlpha));
        }

        root.style.setProperty(
            '--notice-bg',
            cssRGBA(
                blended(v.surface,v.accent,.35),
                .12+.10*opacity
            )
        );

        for(const [token,alpha] of [
            ['--frame-line',1],
            ['--panel-line',1],
            ['--card-line',.72],
            ['--title-line',.48],
            ['--summary-line',.45],
            ['--node-section-line',.34],
            ['--description-line',1],
            ['--notice-line',.50],
            ['--footer-line',.35],
            ['--divider-line',.35]
        ]) {
            root.style.setProperty(
                token,cssRGBA(rgb(v.border),alpha));
        }

        document.body.dataset.theme=
            state.mabinogi ? 'mabinogi' : 'tull-custom';
    }

    const originalVisuals = applySettingsVisuals;
    applySettingsVisuals = function() {
        const result =
            originalVisuals.apply(this,arguments);
        paint();
        window.TULLFTMinimalClient?.publish();
        return result;
    };

    const style = document.createElement('style');
    style.id='s18-user-theme-palette-style';
    style.textContent=`
      #tullCustomThemeEditor{
        padding-top:14px;margin-top:12px;
        border-top:1px solid var(--divider-line)
      }
      #tullCustomThemeEditor .palette-slots{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:8px;margin:12px 0
      }
      #tullCustomThemeEditor .palette-slot{
        padding:10px;border:1px solid var(--card-line);
        background:var(--card-bg);min-width:0
      }
      #tullCustomThemeEditor .palette-slot.is-selected{
        outline:2px solid var(--gold)
      }
      #tullCustomThemeEditor .palette-slot button{
        margin:4px 4px 0 0
      }
      #tullCustomThemeEditor .palette-fields{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px
      }
      #tullCustomThemeEditor .palette-field{
        display:flex;align-items:center;
        gap:9px;flex-wrap:wrap
      }
      #tullCustomThemeEditor .palette-field input{
        height:36px;width:54px;min-width:54px;
        border:1px solid var(--card-line);
        padding:2px;background:transparent
      }
      #tullCustomThemeEditor .palette-field code{
        font-size:12px
      }
      #tullCustomThemeEditor .palette-preview{
        padding:14px;margin-top:12px;
        border:1px solid var(--card-line)
      }
      #tullCustomThemeEditor .palette-contrast-grid{
        display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;margin-top:10px
      }
      #tullCustomThemeEditor .palette-contrast-row{
        display:flex;justify-content:space-between;align-items:center;
        gap:8px;padding:7px;border:1px solid;min-width:0
      }
      #tullCustomThemeEditor .palette-contrast-sample{
        flex:1;min-width:0;overflow-wrap:break-word
      }
      #tullCustomThemeEditor .palette-contrast-result{
        flex:none;font-weight:700;font-variant-numeric:tabular-nums
      }
      @media(max-width:700px){
        #tullCustomThemeEditor .palette-contrast-grid{
          grid-template-columns:1fr
        }
      }
      body[data-theme="mabinogi"] .card,
      body[data-theme="mabinogi"] .popupCard,
      body[data-theme="mabinogi"] .modal,
      body[data-theme="mabinogi"] .settingsSection,
      body[data-theme="mabinogi"] .settingsPanel{
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.22),
          0 6px 18px rgba(10,55,95,.18)
      }
      body[data-theme="mabinogi"] .leftItem,
      body[data-theme="mabinogi"] .action,
      body[data-theme="mabinogi"] .settingsButton,
      body[data-theme="mabinogi"] button,
      body[data-theme="mabinogi"] .tabButton{
        color:var(--ink);
        background:linear-gradient(
          180deg,
          rgba(129,204,241,.92) 0%,
          rgba(79,159,209,.92) 100%
        );
        border:1px solid rgba(33,88,127,.95);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.30),
          inset 0 -1px 0 rgba(8,51,85,.18)
      }
      body[data-theme="mabinogi"] .leftItem:hover,
      body[data-theme="mabinogi"] .leftItem.active,
      body[data-theme="mabinogi"] .action:hover,
      body[data-theme="mabinogi"] .settingsButton:hover,
      body[data-theme="mabinogi"] button:hover,
      body[data-theme="mabinogi"] .tabButton:hover,
      body[data-theme="mabinogi"] .tabButton.active{
        background:linear-gradient(
          180deg,
          rgba(152,229,255,.96) 0%,
          rgba(98,190,235,.96) 100%
        );
        border-color:rgba(63,128,171,.98)

      body[data-theme="mabinogi"] select,
      body[data-theme="mabinogi"] input[type="text"],
      body[data-theme="mabinogi"] textarea,
      body[data-theme="tull-custom"] select,
      body[data-theme="tull-custom"] input[type="text"]{

      }
      @media(max-width:1150px){
        #tullCustomThemeEditor .palette-fields{
          grid-template-columns:1fr
        }
      }
    `;
    document.head.append(style);

    let feedback='';
    let nativeDefaultPending=false;

    function requestDefaultBase() {
        if(settingsState.themeId==='default')
            nativeDefaultPending=false;

        if(settingsState.themeId==='dark-gold' &&
           !nativeDefaultPending) {
            nativeDefaultPending=true;
            sendSetting('themeId','default');
        }
    }

    function mount() {
        if(typeof currentTab==='undefined' ||
           currentTab!=='settings' ||
           (typeof settingsDevOpen!=='undefined' &&
            settingsDevOpen) ||
           typeof settingsState==='undefined' ||
           !settingsState) return;

        const select =
            document.getElementById('uiThemeSelect');
        if(!select) return;

        const card=select.closest('.card');
        if(!card) return;

        if(![...select.options].some(
            o=>o.value==='tull-custom')) {
            select.add(new Option(
                '사용자 지정 RGB','tull-custom'));
        }

        if(![...select.options].some(
            o=>o.value==='mabinogi')) {
            select.add(new Option(
                '마비노기풍 블루','mabinogi'));
        }

        select.value = state.mabinogi ? 'mabinogi' :
            state.active ? 'tull-custom' :
            (settingsState.themeId==='dark-gold' ?
                'dark-gold' : 'default');

        if(!select.dataset.tullPaletteBound) {
            select.dataset.tullPaletteBound='1';

            select.addEventListener('change',()=>{
                state.active =
                    select.value==='tull-custom';
                state.mabinogi =
                    select.value==='mabinogi';
                feedback='';
                if(state.active || state.mabinogi) requestDefaultBase();
                store();
                applySettingsVisuals();
                mount();
            });
        }

        let editor=document.getElementById(
            'tullCustomThemeEditor');

        if(!editor) {
            editor=document.createElement('section');
            editor.id='tullCustomThemeEditor';
            card.append(editor);

            editor.innerHTML=`
              <div class="cardTitle" data-theme-slot-heading>
                커스텀 테마 색상 편집
              </div>
              <div class="small">
                선택한 커스텀 슬롯의 색상을 즉시 저장합니다.
                기본 테마 원본은 변경하지 않습니다.
              </div>
              <div class="palette-fields"
                   data-theme-colors></div>
              <div class="palette-preview"
                   data-theme-preview></div>
              <button type="button"
                      class="settingsButton"
                      data-theme-reset>
                편집 색상 기본값
              </button>
              <div class="small"
                   role="status"
                   data-theme-status></div>
            `;

            editor.querySelector(
                '[data-theme-reset]'
            ).addEventListener('click',()=>{
                state.working=copy(initial);
                state.active=true;
                state.mabinogi=false;
                state.slots[state.selected-1]=copy(state.working);
                requestDefaultBase();
                feedback=`커스텀 ${state.selected} 색상을 기본값으로 재설정했습니다.`;
                store();
                applySettingsVisuals();
                mount();
            });
        }

        const heading=editor.querySelector('[data-theme-slot-heading]');
        if(heading) heading.textContent=`커스텀 ${state.selected} · 색상 편집`;

        const controls=editor.querySelector(
            '[data-theme-colors]');
        controls.replaceChildren();

        for(const [field,label] of fields) {
            const line=document.createElement('label');
            line.className='palette-field';

            const title=document.createElement('span');
            title.textContent=label;

            const input=document.createElement('input');
            input.type='color';
            input.value=state.working[field];
            input.setAttribute('aria-label',label);

            const value=document.createElement('code');
            value.textContent=state.working[field];

            input.addEventListener('input',()=>{
                if(!validColor(input.value)) return;

                if(!state.active || state.mabinogi) return;
                state.working[field]=input.value.toUpperCase();
                state.slots[state.selected-1]=copy(state.working);
                value.textContent=state.working[field];

                requestDefaultBase();
                feedback='';
                store();
                applySettingsVisuals();
                showPreview();
                select.value='tull-custom';
            });

            line.append(title,input,value);
            controls.append(line);
        }

        function showPreview() {
            const preview=editor.querySelector(
                '[data-theme-preview]');
            const v=state.mabinogi ? mabinogi : state.working;

            preview.style.background=v.surface;
            preview.style.color=v.text;
            preview.style.borderColor=v.border;

            const ratio=contrast(v.text,v.surface);
            preview.replaceChildren();

            const head=document.createElement('strong');
            head.textContent='테마 미리보기 · 용사 / 스킬';

            const detail=document.createElement('div');
            detail.textContent=
                `글씨 대비 ${ratio.toFixed(1)}:1${
                    ratio<4.5 ?
                        ' · 낮은 대비 주의' : ''
                }`;
            // Keep the contrast warning legible even when muted is low contrast.
            detail.style.color=contrast('#000000',v.surface)>=
                contrast('#FFFFFF',v.surface) ? '#000000' : '#FFFFFF';

            const accent=document.createElement('span');
            accent.textContent=' 강조 ';
            accent.style.color=v.accent;

            preview.append(head,detail,accent);

            // Static RGB comparisons; preserve all theme and preset values.
            const toHex=values=>'#'+values.map(n=>
                n.toString(16).padStart(2,'0')).join('').toUpperCase();
            const buttonBackground=state.mabinogi ? '#68B6E1' :
                toHex(blended(v.surface,v.accent,.33));
            const samples=[
                ['일반 글씨',v.text,v.surface,4.5],
                ['보조 글씨',v.muted,v.surface,4.5],
                ['강조 글씨',v.accent,v.surface,4.5],
                ['버튼 글씨 · 대표 배경',v.text,buttonBackground,4.5],
                ['테두리 · 표면 (참고)',v.border,v.surface,3]
            ];
            if(state.mabinogi) samples.push(
                ['블루 테마 제목', '#FFFFFF',v.surface,4.5]);

            const grid=document.createElement('div');
            grid.className='palette-contrast-grid';
            let lowCount=0;
            for(const [label,front,back,minimum] of samples) {
                const measured=contrast(front,back);
                if(measured<minimum) lowCount++;
                const row=document.createElement('div');
                row.className='palette-contrast-row';
                row.style.background=back;
                row.style.borderColor=v.border;

                const sample=document.createElement('span');
                sample.className='palette-contrast-sample';
                sample.style.color=front;
                sample.textContent=label;

                const result=document.createElement('span');
                result.className='palette-contrast-result';
                result.style.color=contrast('#000000',back)>=
                    contrast('#FFFFFF',back) ? '#000000' : '#FFFFFF';
                result.textContent=`${measured.toFixed(1)}:1 ${
                    measured<minimum ? '주의' : '충족'}`;
                row.append(sample,result);
                grid.append(row);
            }
            const note=document.createElement('div');
            note.style.marginTop='8px';
            note.style.color=detail.style.color;
            note.textContent=`대비 주의 ${lowCount}곳 · 일반 글씨 4.5:1 / `+
                '테두리 3:1 참고. 버튼은 대표 배경 추정치이며, '+
                '투명한 패널과 실제 게임 장면의 명도는 반영하지 않습니다. '+
                '기본·흑금 테마와 사용자 저장 색상은 변경하지 않습니다.';
            preview.append(grid,note);
        }

        showPreview();

        editor.querySelector(
            '[data-theme-status]'
        ).textContent=feedback || (
            state.active ?
                '사용자 지정 색상 적용 중' :
                state.mabinogi ?
                    '마비노기풍 블루 테마 적용 중' :
                    '기존 테마 적용 중 · 프리셋 보존'
        );

        // B2 swatches reflect saves/edits without rebuilding the settings page.
        window.S18ThemeB2?.refresh?.();
    }

    const originalRender=renderSettings;

    renderSettings=function() {
        const result=
            originalRender.apply(this,arguments);
        mount();
        return result;
    };

    // Stage18 B2: existing Native setting and RGB slot persistence remain authoritative.
    function chooseTheme(key) {
        if (typeof settingsState === 'undefined' || !settingsState)
            return {ok:false,reason:'not-ready'};
        if (key==='default' || key==='dark-gold') {
            state.active=false;
            state.mabinogi=false;
            feedback='';
            store();
            if (settingsState.themeId!==key) sendSetting('themeId',key);
            else applySettingsVisuals();
            mount();
            return {ok:true};
        }
        if (key==='mabinogi') {
            state.active=false;
            state.mabinogi=true;
        } else if (/^slot[123]$/.test(key)) {
            const index=Number(key.slice(4))-1;
            if (!state.slots[index]) state.slots[index]=copy(initial);
            state.selected=index+1;
            state.working=copy(state.slots[index]);
            state.active=true;
            state.mabinogi=false;
        } else return {ok:false,reason:'unknown-theme'};
        feedback='';
        requestDefaultBase();
        store();
        applySettingsVisuals();
        mount();
        return {ok:true};
    }

    window.TULLProfileOwners.palette={
      defaults:()=>({version:1,active:false,mabinogi:false,selected:1,working:copy(initial),slots:[null,null,null]}),
      capture:()=>JSON.parse(JSON.stringify(state)),busy:()=>false,
      preflight:raw=>{if(raw!==null){const v=JSON.parse(raw);if(v.active&&v.mabinogi)throw Error('palette-conflicting-flags');}},
      apply:()=>{const v=JSON.parse(localStorage.getItem(key)||'null');if(v){Object.assign(state,{active:v.active,mabinogi:v.mabinogi,selected:v.selected,working:colorSet(v.working),slots:v.slots.map(x=>x?colorSet(x):null)});}applySettingsVisuals();mount();},
      restore:s=>{Object.assign(state,JSON.parse(JSON.stringify(s)));applySettingsVisuals();mount();},
      verify:()=>!state.active||document.documentElement.style.getPropertyValue('--ink')===state.working.text,
      expected:raw=>{const v=JSON.parse(raw);return {active:v.active,mabinogi:v.mabinogi,selected:v.selected,working:colorSet(v.working),slots:v.slots.map(x=>x?colorSet(x):null)};}
    };
    window.TULLCustomPaletteV1=Object.freeze({
        getState:()=>({
            active:state.active,
            mabinogi:state.mabinogi,
            selected:state.selected,
            working:copy(state.working),
            saved:state.slots.map(x=>!!x),
            slots:state.slots.map(x=>x ? copy(x) : null)
        }),
        choose:chooseTheme
    });

    if(typeof settingsState!=='undefined' &&
       settingsState)
        applySettingsVisuals();

    if(typeof currentTab!=='undefined' &&
       currentTab==='settings')
        mount();
})();
</script>
<script id="tull-font-manager-b4b2a">
(() => {
    'use strict';

    if (window.TULLFontManager) return;

    const fallback = '"Malgun Gothic", sans-serif';
    const storageKey = 'tull.font.uiTitle.v1';
    const initialFontState=Object.freeze({ui:'system',title:'system'});
    const state={...initialFontState};
    const usable = new Map();
    let activeFaces = [];
    let generation = 0;
    let scanLabel = '폰트 목록 수신 대기';

    try {
        const saved = JSON.parse(
            localStorage.getItem(storageKey) || 'null'
        );
        if (saved?.version === 1) {
            for (const key of ['ui','title']) {
                if (typeof saved[key] === 'string' &&
                    saved[key].length <= 512) {
                    state[key] = saved[key];
                }
            }
        }
    } catch (_) {
        // Preserve system defaults.
    }

    const family = id =>
        usable.get(id)?.family || fallback;

    const applyUi = () =>
        document.documentElement.style.setProperty(
            '--tull-ui-font-family',
            family(state.ui)
        );

    const signal = () => {
        applyUi();
        window.dispatchEvent(
            new Event('tull-fonts-updated')
        );
        window.TULLTitleAuthoringProductionR1
            ?.refresh?.();

        if (typeof currentTab !== 'undefined' &&
            currentTab === 'settings') {
            mountSettings();
        }
    };

    const save = () => {
        try {
            localStorage.setItem(
                storageKey,
                JSON.stringify({
                    version:1,
                    ui:state.ui,
                    title:state.title
                })
            );
            return true;
        } catch (_) {
            return false;
        }
    };

    const safeCandidate = x =>
        x &&
        typeof x.id === 'string' &&
        x.id.startsWith('user/') &&
        x.id.length <= 512 &&
        !x.id.split('/').includes('..') &&
        typeof x.label === 'string' &&
        x.label.length <= 512 &&
        typeof x.url === 'string' &&
        x.url.startsWith('assets/fonts/user/') &&
        x.url.length <= 2048 &&
        ['truetype','opentype']
            .includes(x.format);

    async function receiveFontList(message) {
        const ticket = ++generation;

        for (const face of activeFaces) {
            try {
                document.fonts.delete(face);
            } catch (_) {}
        }

        activeFaces = [];
        usable.clear();
        scanLabel = '폰트 검사 중';
        signal();

        if (!Array.isArray(message.fonts) ||
            typeof FontFace !== 'function' ||
            !document.fonts?.add) {
            scanLabel =
                '사용자 폰트 로딩 미지원 · 기본 글꼴 사용';
            signal();
            return;
        }

        const found = new Set();
        let checked = 0;
        const r111Seen={truetype:0,opentype:0,woff:0,woff2:0};
        const r111Loaded={truetype:0,opentype:0,woff:0,woff2:0};
        // R1-11: aggregate diagnostics only; never log a user font name, URL or path.
        const r111Failed = {
            construct:{truetype:0,opentype:0,woff:0,woff2:0},
            load:{truetype:0,opentype:0,woff:0,woff2:0},
            register:{truetype:0,opentype:0,woff:0,woff2:0},
            fallback:{truetype:0,opentype:0,woff:0,woff2:0}
        };
        const r111Error = {NetworkError:0, SyntaxError:0, Other:0};
        let r111Recovered = 0;

        for (const font of message.fonts) {
            if (ticket !== generation) return;
            if (!safeCandidate(font) ||
                found.has(font.id)) continue;

            found.add(font.id);
            ++checked;
            ++r111Seen[font.format];

            let failurePhase = 'construct';
            try {
                const alias =
                    `TULLUserFont_${ticket}_${checked}`;

                const source =
                    `url("${font.url}") format("${font.format}")`;

                let face;
                try {
                    face = new FontFace(alias, source);
                    failurePhase = 'load';
                    await face.load();
                } catch (primaryError) {
                    // Some embedded engines reject the format hint.
                    // Still require real FontFace.load() success for WOFF2.
                    if (font.format !== 'woff2') throw primaryError;
                    failurePhase = 'fallback';
                    face = new FontFace(alias, `url("${font.url}")`);
                    await face.load();
                    ++r111Recovered;
                }

                if (ticket !== generation) return;

                failurePhase = 'register';
                document.fonts.add(face);
                activeFaces.push(face);

                usable.set(font.id, {
                    label:font.label,
                    family:`"${alias}", ${fallback}`
                });
                ++r111Loaded[font.format];
            } catch (error) {
                // Invalid and unsupported fonts remain excluded.
                ++r111Failed[failurePhase][font.format];
                const kind = error && error.name;
                if (kind === 'NetworkError') ++r111Error.NetworkError;
                else if (kind === 'SyntaxError') ++r111Error.SyntaxError;
                else ++r111Error.Other;
            }
        }

        if (ticket !== generation) return;

        scanLabel =
            `사용 가능 ${usable.size}개 · 제외 ${checked-usable.size}개`;
        scanLabel += ' · WOFF/WOFF2 지원 제외';
        // Prisma Native console callback stores one message argument.
        try {
            console.info("[S18FONT][R1-11] renderer " + JSON.stringify({
                candidate:r111Seen, loaded:r111Loaded,
                failed:r111Failed, error:r111Error, woff2Fallback:r111Recovered
            }));
        } catch (_) {}

        if (message.truncated) {
            scanLabel += ' · 검색 상한 도달';
        }

        signal();
    }

    function fillSelect(select, value) {
        if (!select) return;

        const system =
            new Option('맑은 고딕 (기본)', 'system');

        const entries =
            [...usable.entries()].sort(
                (a,b) => a[1].label.localeCompare(
                    b[1].label, 'ko'
                )
            );

        select.replaceChildren(
            system,
            ...entries.map(([id,item]) =>
                new Option(item.label, id)
            )
        );

        select.value =
            usable.has(value) ? value : 'system';
    }

    function mountSettings() {
        if (typeof settingsState === 'undefined' ||
            !settingsState) return;

        const center =
            document.getElementById('centerPanel');

        if (!center) return;

        const devPage = window.TULLS19DevShellB4?.state?.();
        if (typeof currentTab === 'undefined' || currentTab !== 'settings' ||
            !center.querySelector('#developerModeToggle') ||
            (devPage?.unlocked && devPage?.activePage)) {
            document.getElementById('tullFontSettings')?.remove();
            return;
        }

        const existing =
            document.getElementById('tullFontSettings');

        if (existing) {
            fillSelect(
                existing.querySelector('#tullUiFont'),
                state.ui
            );
            fillSelect(
                existing.querySelector('#tullTitleFont'),
                state.title
            );

            const missing =
                ['ui','title'].some(k =>
                    state[k] !== 'system' &&
                    !usable.has(state[k])
                );

            existing.querySelector(
                '#tullFontStatus'
            ).textContent =
                scanLabel +
                (missing ?
                    ' · 미사용 저장 폰트는 맑은 고딕으로 대체 중' :
                    '');

            return;
        }

        const card = document.createElement('div');
        card.id = 'tullFontSettings';
        card.className = 'card';

        card.innerHTML = `
            <div class="cardTitle">폰트</div>
            <div class="small">
                TTF · OTF / 하위 폴더 지원 (WOFF 계열 제외)
            </div>
            <div class="settingsRow">
                <label for="tullUiFont">전체 UI</label>
                <select id="tullUiFont"
                    aria-label="전체 UI 폰트"></select>
            </div>
            <div class="settingsRow">
                <label for="tullTitleFont">기본 칭호</label>
                <select id="tullTitleFont"
                    aria-label="기본 칭호 폰트"></select>
            </div>
            <button class="settingsButton"
                id="tullFontRefresh" type="button">
                폰트 새로고침
            </button>
            <div class="small" id="tullFontStatus"></div>
        `;

        center.append(card);

        for (const [key,id] of [
            ['ui','tullUiFont'],
            ['title','tullTitleFont']
        ]) {
            const control =
                card.querySelector('#' + id);

            fillSelect(control, state[key]);

            control.addEventListener('change', () => {
                state[key] = control.value;

                if (!save()) {
                    card.querySelector(
                        '#tullFontStatus'
                    ).textContent =
                        '설정을 저장하지 못했습니다. ' +
                        '이번 실행에만 적용됩니다.';
                }

                signal();
            });
        }

        card.querySelector(
            '#tullFontRefresh'
        ).addEventListener('click', () => {
            scanLabel = 'Native 목록 요청 중';

            card.querySelector(
                '#tullFontStatus'
            ).textContent = scanLabel;

            send('settings.font.refresh');
        });

        const missing =
            ['ui','title'].filter(k =>
                state[k] !== 'system' &&
                !usable.has(state[k])
            );

        card.querySelector(
            '#tullFontStatus'
        ).textContent =
            scanLabel +
            (missing.length ?
                ' · 미사용 저장 폰트는 맑은 고딕으로 대체 중' :
                '');
    }

    const style = document.createElement('style');
    style.id = 'tull-font-manager-style';

    style.textContent = `
        html, body, button, input, select, textarea,
        #titleInternalModal, #titleContextPopup {
            font-family:
                var(--tull-ui-font-family,
                    "Malgun Gothic",sans-serif) !important;
        }
    `;

    document.head.append(style);

    const previousRenderSettings = renderSettings;

    renderSettings = function() {
        const result =
            previousRenderSettings.apply(this, arguments);

        mountSettings();
        return result;
    };

    const previousReceive = window.tullReceive;

    window.tullReceive = function(payload) {
        const result =
            previousReceive.apply(this, arguments);

        let message = payload;

        try {
            if (typeof payload === 'string') {
                message = JSON.parse(payload);
            }
        } catch (_) {
            message = null;
        }

        if (message?.kind === 'font-list') {
            void receiveFontList(message);
        }

        return result;
    };

    window.TULLProfileOwners.font={defaults:()=>({version:1,...initialFontState}),capture:()=>({state:{...state},generation}),busy:()=>scanLabel==='폰트 검사 중',
      apply:()=>{const v=JSON.parse(localStorage.getItem(storageKey)||'null');if(v)Object.assign(state,{ui:v.ui,title:v.title});signal();},
      restore:s=>{if(generation!==s.generation)throw Error('font-generation-changed');Object.assign(state,s.state);signal();},
      verify:()=>document.documentElement.style.getPropertyValue('--tull-ui-font-family')===family(state.ui),expected:raw=>{const v=JSON.parse(raw);return {ui:v.ui,title:v.title};},missing:refs=>refs.filter(x=>x!=='system'&&!usable.has(x))};
    window.TULLFontManager = Object.freeze({
        getOptions: () =>
            [...usable.entries()].map(([id,x]) =>
                ({id,label:x.label})
            ),
        familyForTitle: id =>
            family(
                id === 'system' ?
                    state.title : id
            ),
        getTitleDefault: () => state.title,
        systemFamily: fallback
    });

    applyUi();

    if (typeof currentTab !== 'undefined' &&
        currentTab === 'settings') {
        mountSettings();
    }
})();
</script>
<script id="S18_R107_IME_CONTROLS">
(() => {

    const V = Array.from('ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ');
    const T = Array.from(' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ');
    const keys = Object.freeze({
        r:'ㄱ', R:'ㄲ', s:'ㄴ', e:'ㄷ', E:'ㄸ', f:'ㄹ', a:'ㅁ',
        q:'ㅂ', Q:'ㅃ', t:'ㅅ', T:'ㅆ', d:'ㅇ', w:'ㅈ', W:'ㅉ',
        c:'ㅊ', z:'ㅋ', x:'ㅌ', v:'ㅍ', g:'ㅎ',
        k:'ㅏ', o:'ㅐ', i:'ㅑ', O:'ㅒ', j:'ㅓ', p:'ㅔ',
        u:'ㅕ', P:'ㅖ', h:'ㅗ', y:'ㅛ', n:'ㅜ', b:'ㅠ',
        m:'ㅡ', l:'ㅣ'
    });
    const vowels = new Set(V);
    const vv = Object.freeze({
        'ㅗㅏ':'ㅘ', 'ㅗㅐ':'ㅙ', 'ㅗㅣ':'ㅚ', 'ㅘㅣ':'ㅙ',
        'ㅜㅓ':'ㅝ', 'ㅜㅔ':'ㅞ', 'ㅜㅣ':'ㅟ', 'ㅝㅣ':'ㅞ',
        'ㅡㅣ':'ㅢ'
    });
    const tt = Object.freeze({
        'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ',
        'ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ',
        'ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'
    });
    const reverseT = Object.fromEntries(Object.entries(tt).map(([k,v]) => [v,[...k]]));
    const initial = new Set(L);
    const final = new Set(T.slice(1));
    const composing = new WeakSet();
    const prismaComposing = new WeakSet();
    const nativeJustCommitted = new WeakSet();
    const owned = new WeakSet();
    const wrappers = new WeakMap();
    const active = new WeakMap();
    const writeLimits = new WeakMap();
    const internalInput = new WeakSet();
    // Captures only the latest locally composed keystroke. Never logged or persisted.
    const nativeTextPending = new WeakMap();
    let mode = 'en';

    function compose(a) {
        if (!a) return '';
        if (!a.l) return a.v || '';
        if (!a.v) return a.l;
        const li=L.indexOf(a.l), vi=V.indexOf(a.v), ti=a.t?T.indexOf(a.t):0;
        if (li<0||vi<0||ti<0) throw new Error('Unsupported Hangul state');
        return String.fromCharCode(0xAC00+(li*21+vi)*28+ti);
    }
    function feed(a,j) {
        if (!a) return {commit:'',next:vowels.has(j)?{l:null,v:j,t:null}:{l:j,v:null,t:null}};
        const b={...a};
        if (vowels.has(j)) {
            if (!b.v) {b.v=j;return {commit:'',next:b};}
            if (b.t) {
                const pair=reverseT[b.t];
                const first=pair?pair[0]:null;
                const second=pair?pair[1]:b.t;
                const prev={...b,t:first};
                if(initial.has(second)) return {commit:compose(prev),next:{l:second,v:j,t:null}};
                return {commit:compose(b),next:{l:null,v:j,t:null}};
            }
            if(vv[b.v+j]) {
                b.vTrail=[...(b.vTrail||[]),b.v];
                b.v=vv[b.v+j];
                return {commit:'',next:b};
            }
            return {commit:compose(b),next:{l:null,v:j,t:null}};
        }
        if(!b.v) return {commit:compose(b),next:{l:j,v:null,t:null}};
        if(!b.l) return {commit:compose(b),next:{l:j,v:null,t:null}};
        if(!b.t && final.has(j)) {b.t=j;return {commit:'',next:b};}
        if(b.t && tt[b.t+j]) {b.t=tt[b.t+j];return {commit:'',next:b};}
        return {commit:compose(b),next:{l:j,v:null,t:null}};
    }
    function undo(a) {
        if(!a) return null;
        const b={...a};
        if(b.t) {b.t=reverseT[b.t]?.[0]||null;return b;}
        if(b.v) {b.v=b.vTrail?.pop()||null;return b.l||b.v?b:null;}
        return null;
    }

    // Pure helpers contain no user input state or field references.
    window.TULLDubeolsikCore=Object.freeze({compose,feed,undo,keys});

    const style=document.createElement('style');
    style.id='S18_R107_IME_STYLE';
    style.textContent=`
.tull-ime-wrap{display:flex;gap:5px;align-items:stretch;min-width:0;width:100%}
.tull-ime-wrap>input,.tull-ime-wrap>textarea{flex:1 1 auto;min-width:0;width:auto!important;margin-bottom:0!important}
.tull-ime-wrap>button{flex:0 0 auto;min-width:67px;min-height:30px;padding:4px 6px;cursor:pointer;border:1px solid var(--card-line);background:var(--card-bg);color:var(--ink);font:inherit;border-radius:4px}
.tull-ime-wrap>button[aria-pressed="true"]{border-color:var(--gold);font-weight:700;background:var(--card-hover-bg)}
.tull-ime-wrap>button:hover{border-color:var(--gold);background:var(--card-hover-bg)}
.tull-ime-wrap[data-kind="search"]{margin-bottom:8px}
.tull-ime-feedback{font-size:11px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.tull-ime-feedback:empty{display:none}`;
    document.head.append(style);

    function show(field,text) {
        const wrapper=wrappers.get(field);
        if(wrapper) wrapper.feedback.textContent=text;
    }
    function refreshButtons() {
        for(const button of document.querySelectorAll('.tull-ime-wrap > button')) {
            button.textContent=mode==='ko'?'한글 ON':'영문 ON';
            button.setAttribute('aria-pressed',String(mode==='ko'));
            button.title='POT 전용 두벌식 · Windows 입력 언어는 변경하지 않음';
        }
    }
    function finish(field) {active.delete(field);}
    function canWrite(field,oldLen,text) {
        const max=field.maxLength;
        return max<0||field.value.length-oldLen+text.length<=max;
    }
    function change(field,start,oldLen,text,next) {
        if(!canWrite(field,oldLen,text)) return false;
        const value=field.value.slice(0,start)+text+field.value.slice(start+oldLen);
        const limit=writeLimits.get(field);
        if(limit&&!limit(value)) return false;
        field.value=value;
        const cursor=start+text.length;
        try{field.setSelectionRange(cursor,cursor);}catch(_){}
        if(next) active.set(field,{
            start:cursor-compose(next).length,
            length:compose(next).length,syllable:next
        });
        else finish(field);
        internalInput.add(field);
        try{field.dispatchEvent(new Event('input',{bubbles:true}));}
        finally{internalInput.delete(field);}
        return true;
    }
    function insert(field,j) {
        const curr=active.get(field);
        const from=field.selectionStart,to=field.selectionEnd;
        const valid=curr&&from===to&&from===curr.start+curr.length&&
            field.value.slice(curr.start,from)===compose(curr.syllable);
        if(!valid) finish(field);
        const result=feed(valid?curr.syllable:null,j);
        return change(field,valid?curr.start:from,valid?curr.length:to-from,
            result.commit+compose(result.next),result.next);
    }
    function removeLast(field) {
        const curr=active.get(field),pos=field.selectionStart;
        if(!curr||pos!==field.selectionEnd||
           pos!==curr.start+curr.length||
           field.value.slice(curr.start,pos)!==compose(curr.syllable)) {
            finish(field);return false;
        }
        const next=undo(curr.syllable);
        change(field,curr.start,curr.length,compose(next),next);
        return true;
    }
    function typedKey(event) {
        if(event.code?.startsWith('Key')&&/^[A-Z]$/.test(event.code.slice(3))) {
            const c=event.code.slice(3).toLowerCase();
            const shifted=event.shiftKey?c.toUpperCase():c;
            return keys[shifted]||keys[c]||null;
        }
        if(/^[a-zA-Z]$/.test(event.key||'')) {
            return keys[event.key]||keys[event.key.toLowerCase()]||null;
        }
        return null;
    }
    function nativeLatin(event) {
        if(typeof event.key==='string' && /^[a-zA-Z]$/.test(event.key))
            return event.key;
        if(typeof event.code==='string' && /^Key[A-Z]$/.test(event.code))
            return event.code.slice(3).toLowerCase();
        return null;
    }
    function isMatchingLatin(letter,expected) {
        return typeof letter==='string' && /^[a-zA-Z]$/.test(letter) &&
            letter.toLowerCase()===expected?.toLowerCase();
    }
    function cancelDuplicatedText(field,event) {
        const pending=nativeTextPending.get(field);
        if(!pending || !event.cancelable ||
            !isMatchingLatin(event.data,pending.letter) ||
            (event.inputType && event.inputType!=='insertText')) return;
        event.preventDefault();
        event.stopImmediatePropagation();
    }
    function repairDuplicatedText(field,event) {
        if(internalInput.has(field)) return;
        const pending=nativeTextPending.get(field);
        if(!pending) {finish(field);return;}
        nativeTextPending.delete(field);
        if(event.inputType && event.inputType!=='insertText') {
            finish(field);return;
        }
        const letter=isMatchingLatin(event.data,pending.letter) ?
            event.data : pending.letter;
        if(isMatchingLatin(letter,pending.letter)) {
            const candidates=[pending.afterCaret,pending.beforeCaret];
            for(const point of new Set(candidates)) {
                const expected=pending.expected;
                if(field.value===expected.slice(0,point)+letter+expected.slice(point)) {
                    field.value=expected;
                    try{field.setSelectionRange(pending.afterCaret,pending.afterCaret);}catch(_){}
                    // The local-composer's synthetic input event has already reached storage.
                    // No second user-visible content change is dispatched for the ghost.
                    return;
                }
            }
        }
        if(field.value!==pending.expected) finish(field);
    }
    function attach(root) {
        if(!root) return;
        const fields=root.querySelectorAll(
            'input[data-nickname],textarea[data-before],textarea[data-after],input[data-search],input[data-profile-display]');
        for(const field of fields) {
            if(owned.has(field)) continue;
            owned.add(field);
            const wrap=document.createElement('span');
            wrap.className='tull-ime-wrap';
            wrap.dataset.kind=field.hasAttribute('data-search')?'search':'title';
            const button=document.createElement('button');
            button.type='button';
            button.setAttribute('aria-label','POT 전용 두벌식 한글/영문 전환');
            const feedback=document.createElement('span');
            feedback.className='tull-ime-feedback';
            feedback.setAttribute('role','status');
            field.parentNode.insertBefore(wrap,field);
            wrap.append(field,button);
            wrap.insertAdjacentElement('afterend',feedback);
            wrappers.set(field,{button,feedback});

            button.addEventListener('click',()=>{
                finish(field);
                mode=mode==='en'?'ko':'en';
                refreshButtons();
                show(field,mode==='ko'?'POT 두벌식 한글 입력':'기존 영문 입력');
                field.focus();
            });
            field.addEventListener('keydown',event=>{
                nativeTextPending.delete(field);
                if(mode!=='ko'||event.ctrlKey||event.altKey||event.metaKey||
                   composing.has(field)||prismaComposing.has(field)||
                   event.isComposing||event.keyCode===229) {
                    if(event.ctrlKey||event.altKey||event.metaKey) finish(field);
                    return;
                }
                const key=typedKey(event);
                if(key) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    const previousCaret=field.selectionStart;
                    const accepted=insert(field,key);
                    const limited=writeLimits.has(field);
                    if(!accepted&&limited)finish(field);
                    if(accepted||limited) {
                        const letter=nativeLatin(event);
                        if(letter) nativeTextPending.set(field,{
                            letter,expected:field.value,
                            beforeCaret:previousCaret,afterCaret:field.selectionStart
                        });
                    }
                } else if(event.key==='Backspace') {
                    if(removeLast(field)) {
                        event.preventDefault();
                        event.stopImmediatePropagation();
                    }
                } else {
                    finish(field);
                }
            },true);
            // Ultralight/Prisma may deliver its native character insertion
            // even after the keydown default was prevented.
            field.addEventListener('keypress',event=>{
                if(mode==='ko' && !event.ctrlKey && !event.altKey &&
                   !event.metaKey && !event.isComposing && typedKey(event)) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                }
            },true);
            field.addEventListener('beforeinput',event=>{
                if(mode==='ko') cancelDuplicatedText(field,event);
            },true);
            field.addEventListener('input',event=>repairDuplicatedText(field,event));
            field.addEventListener('compositionstart',()=>{
                finish(field);
                composing.add(field);
                nativeJustCommitted.delete(field);
            });
            field.addEventListener('compositionend',()=>{
                composing.delete(field);
                nativeJustCommitted.add(field);
            });
            field.addEventListener('keyup',()=>{
                nativeJustCommitted.delete(field);
                nativeTextPending.delete(field);
            });
            field.addEventListener('blur',()=>{
                finish(field);
                composing.delete(field);
                prismaComposing.delete(field);
                nativeJustCommitted.delete(field);
                nativeTextPending.delete(field);
            });
        }
        refreshButtons();
    }
    window.addEventListener('prismaIME_state',event=>{
        const detail=event?.detail;
        const field=document.activeElement;
        if(!field||!owned.has(field)) return;
        const busy=!!detail&&(detail.active===true||
            (typeof detail.composition==='string'&&detail.composition.length>0)||
            (Array.isArray(detail.candidates)&&detail.candidates.length>0));
        if(busy) {
            finish(field);
            prismaComposing.add(field);
        } else prismaComposing.delete(field);
    });
    function blocksEscape() {
        const field=document.activeElement;
        if(!field||!owned.has(field)) return false;
        if(active.has(field)) {
            finish(field);
            return true;
        }
        return composing.has(field)||
            prismaComposing.has(field)||
            nativeJustCommitted.has(field);
    }
    window.TULLImeControls=Object.freeze({
        attach,blocksEscape,
        setWriteLimit:(field,limit)=>writeLimits.set(field,limit),
        isLocalInput:field=>internalInput.has(field),
        isComposing:field=>active.has(field)||
            composing.has(field)||prismaComposing.has(field),
        receive:()=>{}
    });
})();
</script>

<script id="S18_R103_R105_TITLE_AND_SWATCH_CONTROLLER">
(() => {
  'use strict';
  if (window.TULLThemeTitleControlsR103R105) return;

  const colors = [
    '#000000','#292929','#555555','#888888','#BBBBBB','#FFFFFF',
    '#7D2828','#C83E3E','#FF7777','#8E4E27','#CC873D','#F6CC7D',
    '#7C701E','#D6C949','#30764A','#60BF7B','#276C72','#55C0C5',
    '#244B8D','#5F91DC','#56328B','#AA79D8','#853D6A','#DC8DBA'
  ];

  const names = [
    ['surface','전체 색조'],
    ['text','일반 글씨'],
    ['muted','보조 글씨'],
    ['accent','강조 색상'],
    ['border','테두리']
  ];

  const validHex = text =>
    typeof text === 'string' && /^#[0-9A-Fa-f]{6}$/.test(text);

  const key = 'tull.title.lettering.overrides.v1';
  const initialLettering=Object.freeze({fill:null,outline:null});
  const choice={...initialLettering};

  try {
    const saved = JSON.parse(localStorage.getItem(key) || 'null');
    if (saved?.version === 1) {
      if (validHex(saved.fill))
        choice.fill = saved.fill.toUpperCase();
      if (validHex(saved.outline))
        choice.outline = saved.outline.toUpperCase();
    }
  } catch (_) {
    // Malformed storage retains theme-following defaults.
  }

  function applyLettering() {
    for (const [part,css] of [
      ['fill','--tull-title-override-fill'],
      ['outline','--tull-title-override-outline']
    ]) {
      if (choice[part] === null)
        document.body.style.removeProperty(css);
      else
        document.body.style.setProperty(css,choice[part]);
    }
    window.TULLFTMinimalClient?.publish();
  }

  function saveLettering() {
    try {
      localStorage.setItem(key,JSON.stringify({
        version:1,...choice
      }));
      return true;
    } catch (_) {
      return false;
    }
  }

  function button(text,onClick) {
    const b=document.createElement('button');
    b.type='button';
    b.textContent=text;
    b.addEventListener('click',onClick);
    return b;
  }

  function swatchGrid(label,current,select) {
    const group=document.createElement('div');
    group.className='tull-color-swatch-group';

    const title=document.createElement('span');
    title.className='tull-color-swatch-label';
    title.textContent=label;

    const grid=document.createElement('div');
    grid.className='tull-color-swatch-grid';
    grid.setAttribute('role','group');
    grid.setAttribute('aria-label',label);

    for (const hex of colors) {
      const b=button('',()=>select(hex));
      b.style.backgroundColor=hex;
      b.setAttribute('aria-label',`${label} ${hex}`);
      b.setAttribute('aria-pressed',String(current===hex));
      b.title=hex;
      grid.append(b);
    }

    const head=document.createElement('div');
    head.className='tull-color-swatch-head';
    head.append(title);
    const hex=document.createElement('input');
    hex.type='text';
    hex.className='tull-color-swatch-hex';
    hex.maxLength=7;
    hex.value=validHex(current)?current:'#FFFFFF';
    hex.setAttribute('aria-label',`${label} HEX 색상`);
    hex.setAttribute('data-color-hex','');
    const picker=document.createElement('input');
    picker.type='color';
    picker.className='tull-color-swatch-picker';
    picker.value=validHex(current)?current:'#FFFFFF';
    picker.setAttribute('aria-label',`${label} 자유 색상 선택`);
    picker.setAttribute('data-color-picker','');
    const apply=hexValue=>{
      if(!validHex(hexValue)) {hex.setAttribute('aria-invalid','true');return;}
      hex.removeAttribute('aria-invalid');
      hex.value=hexValue.toUpperCase();
      picker.value=hex.value;
      select(hex.value);
    };
    hex.addEventListener('change',()=>apply(hex.value));
    picker.addEventListener('input',()=>apply(picker.value));
    const tools=document.createElement('div');
    tools.className='tull-color-swatch-tools';
    const open=document.createElement('button');
    open.type='button';
    open.className='tull-color-free-open';
    open.textContent='자유 색상';
    open.setAttribute('aria-label',`${label} 자유 색상 선택 펼치기`);
    tools.append(hex,picker,open);
    head.append(tools);
    const popup=document.createElement('div');
    popup.className='tull-free-color-panel';
    popup.hidden=true;
    const plane=document.createElement('div');
    plane.className='tull-free-color-plane';
    plane.setAttribute('role','application');
    plane.setAttribute('aria-label',`${label} 채도와 밝기`);
    const hue=document.createElement('input');
    hue.type='range';
    hue.min='0';hue.max='359';hue.step='1';hue.value='0';
    hue.className='tull-free-color-hue';
    hue.setAttribute('aria-label',`${label} 색상 각도`);
    const status=document.createElement('span');
    status.className='small';
    status.textContent='영역을 클릭·드래그해 색을 선택합니다.';
    popup.append(plane,hue,status);
    let saturation=1,brightness=1;
    const hsvHex=(h,s,v)=>'#'+[5,3,1].map(n=>{
      const k=(n+h/60)%6;
      return Math.round((v-v*s*Math.max(Math.min(k,4-k,1),0))*255)
        .toString(16).padStart(2,'0');
    }).join('').toUpperCase();
    const paintPlane=()=>{
      plane.style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#FFF,hsl(${hue.value},100%,50%))`;
    };
    const applyFree=()=>apply(hsvHex(Number(hue.value),saturation,brightness));
    const move=event=>{
      const r=plane.getBoundingClientRect();
      if(!r.width||!r.height) return;
      saturation=Math.max(0,Math.min(1,(event.clientX-r.left)/r.width));
      brightness=1-Math.max(0,Math.min(1,(event.clientY-r.top)/r.height));
      applyFree();
      event.preventDefault();
    };
    plane.addEventListener('mousedown',event=>{
      if(event.button!==0) return;
      move(event);
      const drag=e=>move(e);
      const stop=()=>{
        window.removeEventListener('mousemove',drag);
        window.removeEventListener('mouseup',stop);
      };
      window.addEventListener('mousemove',drag);
      window.addEventListener('mouseup',stop);
    });
    plane.addEventListener('touchstart',event=>{
      const touch=event.touches?.[0];
      if(touch) move({clientX:touch.clientX,clientY:touch.clientY,preventDefault:()=>event.preventDefault()});
    },{passive:false});
    plane.addEventListener('touchmove',event=>{
      const touch=event.touches?.[0];
      if(touch) move({clientX:touch.clientX,clientY:touch.clientY,preventDefault:()=>event.preventDefault()});
    },{passive:false});
    hue.addEventListener('input',()=>{paintPlane();applyFree();});
    open.addEventListener('click',()=>{
      popup.hidden=!popup.hidden;
      open.setAttribute('aria-expanded',String(!popup.hidden));
      if(!popup.hidden) paintPlane();
    });
    group.append(head,grid,popup);
    return group;

  function refreshThemeSelection(panel) {
    const latest =
      window.TULLCustomPaletteV1?.getState?.()?.working;

    if (!latest) return;

    for (const node of panel.querySelectorAll(
      '[data-theme-swatch]'
    )) {
      const selected=String(
        latest[node.dataset.themeSwatch] || ''
      ).toUpperCase();

      for (const b of node.querySelectorAll('button')) {
        b.setAttribute(
          'aria-pressed',String(b.title===selected)
        );
      }
      if(validHex(selected)) {
        const hex=node.querySelector('[data-color-hex]');
        const picker=node.querySelector('[data-color-picker]');
        if(hex && document.activeElement!==hex) hex.value=selected;
        if(picker) picker.value=selected;
      }
    }
  }

  function mountThemeSwatches(card) {
    let panel=card.querySelector('#tullPaletteSwatchControls');

    if (panel) {
      refreshThemeSelection(panel);
      return;
    }

    panel=document.createElement('section');
    panel.id='tullPaletteSwatchControls';

    // The swatch, HEX and free-color picker are grouped per field.

    const current=
      window.TULLCustomPaletteV1?.getState?.()?.working || {};

    for (const [field,label] of names) {
      const group=swatchGrid(
        label,String(current[field]||'').toUpperCase(),
        hex => {
          // Existing theme controller owns validation/persistence.
          const editor=document.getElementById(
            'tullCustomThemeEditor'
          );
          const inputs=[
            ...(editor?.querySelectorAll(
              '.palette-field input[type="color"]'
            ) || [])
          ];
          const index=names.findIndex(x=>x[0]===field);
          const input=inputs[index];
          if (!input) return;

          input.value=hex;
          input.dispatchEvent(new Event('input',{bubbles:true}));
          refreshThemeSelection(panel);
        }
      );

      group.dataset.themeSwatch=field;
      panel.append(group);
    }

    card.append(panel);
  }

  function mountTitleOverrides(card) {
    if (card.querySelector('#tullTitleLetteringControls')) return;

    const box=document.createElement('section');
    box.id='tullTitleLetteringControls';

    const heading=document.createElement('div');
    heading.className='cardTitle';
    heading.textContent='칭호 글씨와 외곽선';

    const note=document.createElement('p');
    note.className='small';
    note.textContent=
      '기본은 UI 테마에 연동됩니다. ' +
      '직접 지정한 색은 테마 변경보다 우선합니다.';

    box.append(heading,note);

    for (const [part,label,defaultColor] of [
      ['fill','글씨','#000000'],
      ['outline','글씨 외곽선','#FFFFFF']
    ]) {
      const row=document.createElement('div');
      row.className='tull-title-lettering-row';

      const toggleLabel=document.createElement('label');
      const toggle=document.createElement('input');
      toggle.type='checkbox';
      toggle.checked=choice[part]===null;

      const text=document.createElement('span');
      text.textContent=label+' · 테마 따름';
      toggleLabel.append(toggle,text);

      const hexInput=document.createElement('input');
      hexInput.type='text';
      hexInput.maxLength=7;
      hexInput.value=choice[part]||defaultColor;
      hexInput.setAttribute('aria-label',label+' 수동 HEX');

      const feedback=document.createElement('span');
      feedback.className='small';

      let swatches=null;

      const refreshSwatches=()=>{
        if (!swatches) return;
        for (const b of swatches.querySelectorAll('button')) {
          b.setAttribute(
            'aria-pressed',
            String(choice[part]!==null && b.title===choice[part])
          );
        }
        const color=choice[part]||defaultColor;
        const hex=swatches.querySelector('[data-color-hex]');
        const picker=swatches.querySelector('[data-color-picker]');
        if(hex && document.activeElement!==hex) hex.value=color;
        if(picker) picker.value=color;
      };

      const commit=hex=>{
        if (!validHex(hex)) {
          feedback.textContent='#RRGGBB 형식이 필요합니다.';
          return;
        }

        choice[part]=hex.toUpperCase();
        hexInput.value=choice[part];
        toggle.checked=false;

        applyLettering();
        refreshSwatches();

        feedback.textContent=saveLettering() ?
          '수동 색상 저장' : '색상 적용됨 · 저장 실패';
      };

      toggle.addEventListener('change',()=>{
        if (toggle.checked) {
          choice[part]=null;
          applyLettering();
          refreshSwatches();

          feedback.textContent=saveLettering() ?
            '테마 연동' : '테마 연동 · 저장 실패';
        } else {
          commit(hexInput.value);
        }
      });

      hexInput.addEventListener(
        'change',()=>commit(hexInput.value)
      );

      swatches=swatchGrid(label,choice[part],commit);

      hexInput.style.display='none';
      // Preserve legacy HEX input contract but expose only the grouped editor.
      row.append(toggleLabel,hexInput,feedback,swatches);
      box.append(row);
    }

    const preview=document.createElement('div');
    preview.id='tullTitleLetteringSample';
    preview.textContent='칭호 미리보기';
    box.append(preview);
    card.append(box);
  }

  function mount() {
    if (typeof currentTab==='undefined' ||
        currentTab!=='settings') return;

    const select=document.getElementById('uiThemeSelect');
    const card=select?.closest('.card');

    if (!card || !window.TULLCustomPaletteV1) return;

    mountThemeSwatches(card);
    mountTitleOverrides(card);
  }

  applyLettering();

  const previousRenderSettings=renderSettings;

  renderSettings=function(...args) {
    const result=previousRenderSettings.apply(this,args);
    mount();
    return result;
  };

  window.TULLProfileOwners.lettering={defaults:()=>({version:1,...initialLettering}),capture:()=>({...choice}),busy:()=>false,
    apply:()=>{const v=JSON.parse(localStorage.getItem(key)||'null');if(v)for(const k of ['fill','outline'])choice[k]=v[k]===null?null:v[k].toUpperCase();applyLettering();mount();},
    restore:s=>{Object.assign(choice,s);applyLettering();mount();},verify:()=>['fill','outline'].every(k=>document.body.style.getPropertyValue('--tull-title-override-'+k)===(choice[k]||'')),expected:raw=>{const v=JSON.parse(raw);return {fill:v.fill?.toUpperCase()??null,outline:v.outline?.toUpperCase()??null};}};
  window.TULLThemeTitleControlsR103R105=Object.freeze({
    getOverrides:()=>({
      fill:choice.fill,
      outline:choice.outline
    }),
    refreshThemeSwatches:()=>{
      const panel=document.getElementById('tullPaletteSwatchControls');
      if(panel) refreshThemeSelection(panel);
    }
  });

  mount();
})();
</script>
<script id="S18_P0_UI_HANDSHAKE_R1">
(() => {
    'use strict';
    // One-time bootstrap and bounded diagnostic evidence, not polling.
    let rxCount = 0;
    let clickCount = 0;
    const log = value => {
        try { console.info('[S18P0] ' + value); } catch (_) {}
    };
    const originalReceive = window.tullReceive;
    if (typeof originalReceive === 'function') {
        window.tullReceive = function(payload) {
            let kind = 'unknown';
            try {
                const data = typeof payload === 'string' ?
                    JSON.parse(payload) : payload;
                if (typeof data?.kind === 'string') kind = data.kind;
            } catch (_) {
                kind = 'invalid-json';
            }
            try {
                const result = originalReceive.apply(this, arguments);
                if (rxCount++ < 16) {
                    const state = typeof buildState !== 'undefined' &&
                        buildState?.classes?.length > 0 ? 'ready' : 'waiting';
                    const footer = document.getElementById('bridgeStatus');
                    log('RX kind=' + kind + ' catalog=' + state +
                        ' footer=' + (footer?.textContent?.includes('connected') ?
                        'connected' : 'waiting'));
                }
                return result;
            } catch (_) {
                log('RX_EXCEPTION kind=' + kind);
                throw _;
            }
        };
    }
    document.addEventListener('click', event => {
        if (clickCount++ >= 8) return;
        const tab = event.target?.closest?.('#topbar .tab');
        const hit = tab ? String(tab.dataset.tab) :
            (event.target?.closest?.('#closeButton') ? 'close' : 'other');
        log('CLICK target=' + hit);
        window.setTimeout(() => {
            const active = document.querySelector('#topbar .tab.active');
            log('CLICK_RESULT active=' + (active?.dataset.tab || 'none'));
        }, 0);
    }, true);
    const start = () => {
        const command = window.tullDebugCommand;
        const titleCommand = window.tullTitleCommand;
        log('LOAD listener=' + (typeof command === 'function' ?
            'available' : 'missing') + ' receiver=' +
            (typeof window.tullReceive === 'function' ? 'available' : 'missing'));
        if (typeof command !== 'function') return;
        try {
            // No timer loop: Native already owns these snapshot commands.
            command('settings.refresh');
            command('build.refresh');
            if (typeof titleCommand === 'function') {
                titleCommand('title.refresh');
            }
            log('SNAPSHOT_REQUEST_SENT verified=false');
        } catch (_) {
            log('SNAPSHOT_REQUEST_EXCEPTION');
        }
    };
    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start, {once:true});
})();
</script>

<script id="S18_THEME_B2_SIX_SWATCH_BUTTONS">
(() => {

    let page='ui';
    let colorTab='theme';
