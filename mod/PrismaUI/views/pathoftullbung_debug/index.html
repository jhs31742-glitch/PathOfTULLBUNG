    const make=(tag,cls,text)=>{
        const element=document.createElement(tag);
        if(cls) element.className=cls;
        if(text!==undefined) element.textContent=text;
        return element;
    };
    const options=[
        ['default','기본 양피지',{surface:'#F4EBC9',text:'#2A2116',accent:'#B67B20',border:'#59472E'}],
        ['dark-gold','흑금',{surface:'#282C24',text:'#EEE4CB',accent:'#D7B467',border:'#AD955F'}],
        ['mabinogi','마비노기',{surface:'#56A8D8',text:'#F7FCFF',accent:'#8FE9FF',border:'#2F6F9C'}],
        ['slot1','커스텀 1',null],
        ['slot2','커스텀 2',null],
        ['slot3','커스텀 3',null]
    ];
    function selectedKey(state){
        if(state.active){
            const slot=state.slots[state.selected-1];
            return slot && ['surface','text','muted','accent','border'].every(
                key=>slot[key]===state.working[key]) ? `slot${state.selected}` : 'editing';
        }
        if(state.mabinogi) return 'mabinogi';
        return settingsState?.themeId==='dark-gold' ? 'dark-gold' : 'default';
    }
    function refresh(){
        const grid=document.getElementById('s18ThemeChoiceGrid');
        if(!grid || !palette) return;
        const state=palette.getState();
        const selected=selectedKey(state);
        grid.replaceChildren();
        for(const [key,label,base] of options){
            const index=key.startsWith('slot') ? Number(key.slice(4))-1 : -1;
            const colors=index>=0 ? state.slots[index] : base;
            const button=make('button','s18-theme-choice');
            button.type='button';
            button.dataset.themeChoice=key;
            button.setAttribute('aria-pressed',String(selected===key));
            button.disabled=false;
            const mini=make('div','s18-theme-mini');
            mini.style.background=colors?.surface||'var(--card-bg)';
            mini.style.borderColor=colors?.border||'var(--card-line)';
            const line=make('div','s18-theme-mini-line');
            line.textContent='Aa 가나다';
            line.style.color=colors?.text||'var(--muted)';
            const accent=make('div','s18-theme-mini-accent');
            accent.style.background=colors?.accent||'var(--card-line)';
            mini.append(line,accent);
            button.append(mini,make('span','s18-theme-choice-name',label));
            button.append(make('span','s18-theme-choice-state',index>=0 ?
                (colors?'선택해서 편집':'새 슬롯 생성') : '기본 테마'));
            button.addEventListener('click',()=>{
                const outcome=palette.choose(key);
                feedback=outcome.ok ? '' : '테마 선택을 처리하지 못했습니다.';
                refresh();
            });
            grid.append(button);
        }
        const editor=document.getElementById('tullCustomThemeEditor');
        const swatches=document.getElementById('tullPaletteSwatchControls');
        const canEdit=page==='colors' && colorTab==='theme' && state.active && !state.mabinogi;
        if(editor) editor.style.display=canEdit?'':'none';
        if(swatches) swatches.style.display=canEdit?'':'none';
        window.TULLThemeTitleControlsR103R105?.refreshThemeSwatches?.();
        const status=document.getElementById('s18ThemeB2Status');
        if(status) status.textContent=feedback ||
            (canEdit?`커스텀 ${state.selected} 색상 편집 · 변경 즉시 저장`:
            '테마를 선택하면 즉시 적용합니다. 커스텀은 선택 후 색상을 편집합니다.');
    }
    function mount(){
        if(typeof currentTab==='undefined' || currentTab!=='settings' ||
           (typeof settingsDevOpen!=='undefined' && settingsDevOpen)) return;
        const left=document.getElementById('leftPanel');
        const center=document.getElementById('centerPanel');
        const themeSelect=document.getElementById('uiThemeSelect');
        const hudToggle=document.getElementById('hudMasterToggle');
        if(!left || !center || !themeSelect || !hudToggle || !palette) return;
        const theme=themeSelect.closest('.card');
        const hud=hudToggle.closest('.card');
        if(!theme || !hud) return;
        const first=left.querySelector('.leftItem');
        if(!first) return;
        first.classList.toggle('active',page==='ui');
        first.addEventListener('click',()=>{page='ui';renderSettings();});
        // The HUD Editor already owns its sidebar entry. B2 owns only theme.
        for(const [id,name] of [['colors','색상']]){
            const item=make('div','leftItem'+(page===id?' active':''));
            item.append(make('div','leftTitle',name));
            item.append(make('div','small','테마·칭호 색상'));
            item.setAttribute('role','button');
            item.tabIndex=0;
            const open=()=>{page=id;renderSettings();};
            item.addEventListener('click',open);
            item.addEventListener('keydown',event=>{
                if(event.key==='Enter'||event.key===' '){event.preventDefault();open();}
            });
            const dev=Array.from(left.querySelectorAll('.leftItem')).find(x=>
                x.querySelector('.small')?.textContent?.includes('Developer Mode'));
            if(dev) left.insertBefore(item,dev);
            else left.append(item);
        }
        for(const child of Array.from(center.children)){
            if(!child.classList.contains('card')) continue;
            child.style.display=child===theme ? (page==='colors'?'':'none') :
                child===hud ? 'none' :
                (page==='ui'?'':'none');
        }
        const heading=center.querySelector('h1');
        if(heading) heading.textContent=page==='colors'?'색상':'설정';
        const description=center.querySelector('.subtitle');
        if(description && page==='colors') description.style.display='none';
        if(page==='colors') {
            const tabs=make('div');
            tabs.id='s18ColorSubtabs';
            tabs.setAttribute('role','tablist');
            for(const [id,label] of [['theme','테마'],['title','칭호']]) {
                const button=make('button','',label);
                button.type='button';
                button.setAttribute('role','tab');
                button.setAttribute('aria-selected',String(colorTab===id));
                button.addEventListener('click',()=>{colorTab=id;renderSettings();});
                tabs.append(button);
            }
            center.insertBefore(tabs,theme);
        }
        const colorControls=theme.querySelector('#tullPaletteSwatchControls');
        const editor=theme.querySelector('#tullCustomThemeEditor');
        if(colorControls && editor) theme.insertBefore(colorControls,editor);
        const titleControls=theme.querySelector('#tullTitleLetteringControls');
        for(const child of Array.from(theme.children)) {
            if(page!=='colors') continue;
            child.style.display=colorTab==='title' ?
                (child===titleControls?'':'none') :
                (child===titleControls?'none':'');
        }
        const themeRow=themeSelect.closest('.settingsRow');
        if(themeRow) themeRow.style.display='none';
        let grid=theme.querySelector('#s18ThemeChoiceGrid');
        if(!grid){
            grid=make('div');
            grid.id='s18ThemeChoiceGrid';
            grid.setAttribute('role','group');
            grid.setAttribute('aria-label','UI 테마 선택');
            theme.insertBefore(grid,theme.querySelector('#tullCustomThemeEditor'));
            const status=make('div','small');
            status.id='s18ThemeB2Status';
            status.setAttribute('role','status');
            grid.after(status);
        }
        refresh();
    }
    const previous=renderSettings;
    renderSettings=function(...args){
        const result=previous.apply(this,args);
        mount();
        return result;
    };
    window.S18ThemeB2=Object.freeze({refresh});
    if(typeof currentTab!=='undefined' && currentTab==='settings') mount();
})();
</script>

(() => {

  if (window.S18QA4GColorEditor) return;
  const fields=[['surface','전체 색조'],['text','일반 글씨'],['muted','보조 글씨'],['accent','강조 색상'],['border','테두리']];
  const titleFields=[['fill','글씨'],['outline','글씨 외곽선']];
  const colors=['#000000','#292929','#555555','#888888','#BBBBBB','#FFFFFF','#7D2828','#C83E3E','#FF7777','#8E4E27','#CC873D','#F6CC7D','#7C701E','#D6C949','#30764A','#60BF7B','#276C72','#55C0C5','#244B8D','#5F91DC','#56328B','#AA79D8','#853D6A','#DC8DBA'];
  const favoritesKey='tull.ui.shared.colors.v1';
  const valid=x=>typeof x==='string' && /^#[0-9a-f]{6}$/i.test(x);
  const rgb=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));

    const [r,g,b]=rgb(x).map(v=>v/255);

  const fallbackDark={surface:'#282C24',text:'#EEE4CB',muted:'#B2A78C',accent:'#D7B467',border:'#AD955F'};
  const fallbackBlue={surface:'#56A8D8',text:'#F7FCFF',muted:'#DCE8F8',accent:'#8FE9FF',border:'#2F6F9C'};
  const savedSlotCount=24;
  let savedColors=Array(savedSlotCount).fill(null);

    if(obj?.version===1 && Array.isArray(obj.colors))

    modal.innerHTML=`<div class="s18g-dialog-head"><h2 data-heading>색 편집</h2><button type="button" data-close aria-label="닫기">✕</button></div>
    <div class="s18g-dialog-main"><section><strong>기본 색상</strong><div class="s18g-swatches" data-basic></div><strong>사용자 지정 색상 (최대 24개)</strong><div class="s18g-swatches" data-saved></div><p class="small">클릭: 선택 · 더블클릭: 적용 · 칸 우클릭: 즉시 비우기. 자유 색상 더블클릭: 선택 칸 덮어쓰기 또는 첫 빈 칸 저장.</p></section>
    <section><strong>자유 색상 선택</strong><div class="s18g-plane" data-plane role="application" aria-label="가로 색조 세로 채도"><div class="s18g-mark" data-mark></div></div><label class="s18g-bright-label">명도 (밝기)<output data-bright-out>100%</output></label><input type="range" class="s18g-bright" data-bright min="0" max="100" step="1" aria-label="명도"><div class="s18g-fields-grid"><label>HEX<input data-hex maxlength="7" aria-label="HEX"></label><label>R<input type="number" data-r min="0" max="255" step="1"></label><label>G<input type="number" data-g min="0" max="255" step="1"></label><label>B<input type="number" data-b min="0" max="255" step="1"></label><label>H<input type="number" data-h min="0" max="360" step="1" aria-label="H 색조"></label><label>S<input type="number" data-s min="0" max="100" step="1" aria-label="S 채도"></label><label>L<input type="number" data-l min="0" max="100" step="1" aria-label="L 명도"></label></div><div class="s18g-dialog-foot"><span class="s18g-current-swatch" data-current></span><button type="button" data-save>사용자 색상에 저장</button><button type="button" data-cancel>취소</button><button type="button" data-accept>확인</button></div><p class="small" data-notice role="status"></p></section></div>`;
    document.body.append(modal);
    const $=s=>modal.querySelector(s);

      for(const button of modal.querySelectorAll('[data-color]'))button.setAttribute('aria-pressed',String(button.dataset.color===draft));
    };
    const colorBtn=(value)=>{
      const b=el('button');b.type='button';b.dataset.color=value;b.title=value;b.style.backgroundColor=value;

    };

    function saveFavorites(){
      try{localStorage.setItem(favoritesKey,JSON.stringify({version:1,colors:savedColors}));return true;}
      catch(_){return false;}
    }
    const updateSlotSelection=()=>{
      modal.querySelectorAll('[data-saved-index]').forEach(b=>{

    const intField=(key,max)=>{

    const clearEntry=()=>{$('[data-notice]').textContent='확인 시 현재 항목에 적용합니다. 취소하면 변경하지 않습니다.';};
    const entry=(key,apply,keepSaturation=false)=>{

      dialog.append(make('h3','',wasUnlocked?'DEV 확장 종료':'DEV 확장 진입'));

        : '별도 시험 세이브에서 진행하나요?');
      dialog.append(warning);
      let entry = null;
      let entryError = null;
      if (!wasUnlocked && !entryAccepted()) {
        entry = document.createElement('input');
        entry.type = 'password';
        entry.autocomplete = 'off';
        entry.spellcheck = false;
        entry.setAttribute('aria-label','인증 입력');

        dialog.append(entry,entryError);

      const buttons = make('div','');
      buttons.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;margin-top:18px';
      const cancel = make('button','settingsButton','취소');

      cancel.type = approve.type = 'button';
      const close = () => {
        document.body.classList.remove('s19-dev-confirm-open');
        if (dialog.open && typeof dialog.close === 'function') {
          try { dialog.close(); } catch (_) {}

      approve.addEventListener('click',()=>{
        if (!authorized() || unlocked !== wasUnlocked) {
          close();
          console.warn('[S19DEV][ENTRY] request rejected: state changed');
          return;
        }
        if (entry && entry.value.toLowerCase() !== 'tull') {
          entryError.textContent = '입력값을 다시 확인하세요.';
          entry.select();
          return;
        }
        if (entry) {
          localStorage.setItem(entryKey,'1');
          entry.value = '';
        }
        close();
        console.info('[S19DEV][ENTRY] command=dev.extension.toggle');
        pendingDevToggle = true;
        try {
          send('dev.extension.toggle');
        } catch (error) {
          pendingDevToggle = false;
          throw error;
        }
      });
      entry?.addEventListener('keydown',event=>{
        if (event.key==='Enter') { event.preventDefault(); approve.click(); }
      });
      buttons.append(cancel,approve);
      dialog.append(buttons);
      document.body.append(dialog);
      document.body.classList.add('s19-dev-confirm-open');
      try {
        if (typeof dialog.showModal === 'function') dialog.showModal();
        else dialog.setAttribute('open','');
      } catch (_) { dialog.setAttribute('open',''); }
      entry?.focus();
      console.info('[S19DEV][ENTRY] confirmation presented');
    }

  function mount(){
    mountFooter();

    const oldDev=Array.from(left.querySelectorAll('.leftItem')).find(x=>
      x.querySelector('.small')?.textContent?.trim()==='Developer Mode');

      left.querySelectorAll('.leftItem.active:not(.s19-dev-link)').forEach(n=>n.classList.remove('active'));

  const oldRender=renderSettings;
  renderSettings=function(...args){
    if(!authorized())drop();
    if(!(unlocked && activePage && authorized()) || currentTab!=='settings'){
      $('s19DevCommonControls')?.remove();
    }
    settingsDevOpen=false;
    const result=oldRender.apply(this,args);
    mount();
    return result;
  };
  const oldReceive=window.tullReceive;
  window.tullReceive=function(payload){
    let parsed=payload;
    try{if(typeof payload==='string')parsed=JSON.parse(payload);}catch(_){/* original handler will report */}
    const result=oldReceive.apply(this,arguments);
    if(parsed?.kind==='native-main-reopen'){
      pendingDevToggle = false;
      // Hidden QA session remains active; Native sends authoritative extension status.
    } else if(parsed?.kind==='settings' && !parsed.developerMode){
      drop();
    } else if(parsed?.kind==='s19-reset-result'){
      console.info('[S19DEV][RESET] RESULT ok='+!!parsed.ok);
      lastProfileMessage=parsed.ok ? '직업·노드 초기화 완료 (Native 재검증)' : '직업·노드 초기화 실패 · 기준 세이브 복구 필요';
      const status=$('s19DevProfileResult');if(status)status.textContent=lastProfileMessage;
    } else if(parsed?.kind==='s19-profile-result'){
      console.info('[S19DEV][CASE] RESULT ok='+!!parsed.ok+' label='+(parsed.label||''));
      lastProfileMessage=parsed.ok ? `완료 확인 · ${parsed.label || '시험 조합'}` : `검증 실패 · ${parsed.reason || '로그 확인'}`;
      const status=$('s19DevProfileResult');if(status)status.textContent=lastProfileMessage;
    } else if(parsed?.kind==='dev-extension'){
      const requested = pendingDevToggle;
      pendingDevToggle = false;
      const wasUnlocked = unlocked;
      unlocked=!!parsed.enabled && authorized();
      if(!unlocked){
        activePage=null;
        lastSelectedPage='build';
      } else if(requested){
        activePage=lastSelectedPage==='equipment'?'equipment':'build';
      }
      if(requested){
        settingsDevOpen=false;
        currentTab='settings';
        render();
      } else if(wasUnlocked && !unlocked && currentTab==='settings'){
        render();
      }
    }
    return result;
  };
  const left=$('leftPanel');
  if(left){
    left.addEventListener('click',event=>{
      const item=event.target.closest('.leftItem');
      if(item && !item.classList.contains('s19-dev-link'))activePage=null;
    },true);
  }
  mountFooter();
  window.TULLS19DevShellB4=Object.freeze({
    state:()=>({unlocked,activePage,entryAccepted:entryAccepted(),buildSubtab:subtab.build,equipmentSubtab:subtab.equipment}),
    close:()=>{drop();if(currentTab==='settings')renderSettings();}
  });
})();

<script id="S20_A_BROWSER_CORE_R2">
(() => {
  'use strict';
  if (window.TULLUIBrowserBackupR2) return;
  const STORE = 'tull.ui.browserBackup.v1';
  const slots = [1, 2, 3];
  const keys = Object.freeze([
    'tull.ui.customPalette.v1',
    'tull.ui.shared.colors.v1',
    'tull.title.lettering.overrides.v1',
    'tull.font.uiTitle.v1',
    'tull.preview.authoring.working.v1',
    ...slots.map(n => `tull.preview.authoring.preset.${n}.v1`),
    'tull.titleGrid.working.v1',
    ...slots.map(n => `tull.titleGrid.preset.${n}.v1`),
    ...slots.map(n => `tull.hudEditor.preset.${n}.v1`),
    'tull.hudEditor.selectedPreset.v1'
  ]);
  const obj = x => x !== null && typeof x === 'object' && !Array.isArray(x);
  const hex = x => typeof x === 'string' && /^#[0-9a-f]{6}$/i.test(x);
  const colors = ['surface', 'text', 'muted', 'accent', 'border'];
  const titleIds = slots.concat([4, 5, 6]).map(n => `BLOCK_TITLE_${String(n).padStart(2, '0')}`);

  function safe(x, depth = 0) {
    if (depth > 32) return false;
    if (Array.isArray(x)) return x.every(y => safe(y, depth + 1));
    if (!obj(x)) return true;
    return Object.keys(x).every(k =>
      k !== '__proto__' && k !== 'constructor' && k !== 'prototype' && safe(x[k], depth + 1));
  }
  function rect(r) {
    return obj(r) && ['x', 'y', 'w', 'h'].every(k => Number.isInteger(r[k])) &&
      r.x >= 0 && r.y >= 0 && r.w >= 4 && r.h >= 6 &&
      r.x + r.w <= 100 && r.y + r.h <= 100;
  }
  function valid(key, raw) {
    if (raw === null) return true;
    if (typeof raw !== 'string' || raw.length > 100000) return false;
    if (key === 'tull.hudEditor.selectedPreset.v1') return /^[123]$/.test(raw);
    let v;
    try { v = JSON.parse(raw); } catch (_) { return false; }
    if (!obj(v) || v.version !== 1 || !safe(v)) return false;
    if (key === 'tull.ui.customPalette.v1') {
      return typeof v.active === 'boolean' && typeof v.mabinogi === 'boolean' &&
        Number.isInteger(v.selected) && v.selected >= 1 && v.selected <= 3 &&
        obj(v.working) && colors.every(k => hex(v.working[k])) &&
        Array.isArray(v.slots) && v.slots.length === 3 &&
        v.slots.every(s => s === null || (obj(s) && colors.every(k => hex(s[k]))));
    }
    if (key === 'tull.ui.shared.colors.v1')
      return Array.isArray(v.colors) && v.colors.length <= 24 &&
        v.colors.every(c => c === null || hex(c));
    if (key === 'tull.title.lettering.overrides.v1')
      return ['fill', 'outline'].every(k => v[k] === null || hex(v[k]));
    if (key === 'tull.font.uiTitle.v1')
      return ['ui', 'title'].every(k => typeof v[k] === 'string' &&
        v[k].length <= 512 && !/[\x00-\x1f\x7f]/.test(v[k]));
    if (key.startsWith('tull.preview.authoring.'))
      return obj(v.global) && obj(v.classes);
    if (key.startsWith('tull.titleGrid.'))
      return obj(v.geometry) && titleIds.every(id => rect(v.geometry[id])) &&
        (!key.includes('.preset.') ||
          (Number.isInteger(v.activeMask) && v.activeMask >= 0 && v.activeMask <= 63)) &&
        (v.presentation === undefined || obj(v.presentation));
    if (key.startsWith('tull.hudEditor.preset.'))
      return typeof v.masterVisible === 'boolean' && obj(v.hud) &&
        ['void', 'composure', 'quiet'].every(k => {
          const h = v.hud[k];
          return obj(h) && typeof h.visible === 'boolean' &&
            ['x', 'y', 'scale', 'opacity'].every(f =>
              typeof h[f] === 'number' && Number.isFinite(h[f]));
        });
    return false;
  }
  function validBundle(b) {
    return obj(b) && b.schema === 2 && obj(b.values) && safe(b) &&
      Object.keys(b.values).length === keys.length &&
      keys.every(k => Object.prototype.hasOwnProperty.call(b.values, k) &&
        valid(k, b.values[k]));
  }
  function put(key, value) {
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
    if (localStorage.getItem(key) !== value) throw new Error('readback-failed');
  }
  function save() {
    let before;
    let touched = false;
    try {
      const values = Object.create(null);
      for (const k of keys) {
        values[k] = localStorage.getItem(k);
        if (!valid(k, values[k])) return {ok: false, reason: 'invalid-source'};
      }
      const bundle = {schema: 2, values};
      if (!validBundle(bundle)) return {ok: false, reason: 'invalid-bundle'};
      const raw = JSON.stringify(bundle);
      if (raw.length > 450000) return {ok: false, reason: 'too-large'};
      before = localStorage.getItem(STORE);
      touched = true;
      put(STORE, raw);
      return {ok: true, count: keys.length};
    } catch (_) {
      if (touched) {
        try { put(STORE, before); }
        catch (_) { return {ok: false, reason: 'backup-rollback-failed'}; }
      }
      return {ok: false, reason: 'storage-failed'};
    }
  }
  function restore() {
    let bundle;
    try {
      const raw = localStorage.getItem(STORE);
      if (raw === null || raw.length > 450000) return {ok: false, reason: 'backup-missing'};
      bundle = JSON.parse(raw);
    } catch (_) { return {ok: false, reason: 'backup-unreadable'}; }
    if (!validBundle(bundle)) return {ok: false, reason: 'invalid-bundle'};
    const before = Object.create(null);
    const touched = [];
    try {
      for (const k of keys) before[k] = localStorage.getItem(k);
      for (const k of keys) {
        touched.push(k);
        put(k, bundle.values[k]);
      }
      return {ok: true, count: keys.length, restartRequired: true};
    } catch (_) {
      let rollbackOk = true;
      for (const k of touched.reverse()) {
        try { put(k, before[k]); } catch (_) { rollbackOk = false; }
      }
      return {ok: false, reason: rollbackOk ? 'rolled-back' : 'rollback-failed'};
    }
  }
  window.TULLUIBrowserBackupR2 = Object.freeze({keys: () => [...keys], valid, save, restore});
})();

  'session-mismatch':'게임 상태가 바뀌었습니다. 다시 시도하세요.',
  'style-stale':'칭호 스타일이 바뀌었습니다. 다시 시도하세요.',
  'command-rejected':'Native가 칭호 표시 요청을 거절했습니다.',
  'transport-timeout':'표시 응답 확인 필요',
  'frame-runtime-unsupported':'지원하지 않는 게임 버전입니다.',
  'frame-main-thread-unavailable':'게임 스레드를 확인하지 못했습니다.',
  'frame-chain-unavailable':'HUD 연결을 확인하지 못했습니다.'
};
function clearRequest(){
  if(request)clearTimeout(request.timer);
  request=null;
}
function requestState(){
  clearTimeout(stateTimer);
  stateRetry=0;
  if(session){send('ft.state');return;}
  const attempt=()=>{
    if(session)return;
    send('ft.state');
    if(++stateRetry<4)stateTimer=setTimeout(attempt,350);
    else if(!session){notice='FT 초기 연결 응답 대기 · 다시 클릭하여 확인';paint();}
  };
  attempt();
}
const traceCounts={send:0,status:0,on:0};
function traceFT(stage, detail){
  if(traceCounts[stage]++>=8)return;
  try{console.info('[FTTRACE] '+stage+' '+detail);}catch{}
}
function toggle(wanted){
  if(request)return;
  notice='';
  if(!session){
    notice='FT 초기 연결 확인 중 · 연결 후 다시 클릭';
    requestState();
    paint();
    return;
  }
  if(importing||window.TULLProfilesA5?.status?.()?.blocked||window.TULLProfilesA5?.uiBusy?.()){
    notice='설정 작업이 끝난 뒤 다시 시도하세요.';
    paint();
    return;
  }
  let style,captureValue;
  if(wanted){
    try{captureValue=capture();style=makeStyle(captureValue);}catch{
      notice='칭호 스타일을 준비하지 못했습니다.';
      paint();
      return;
    }
  }
  const id=wanted?++nextRequest:0;
  const wire=wanted?'ft.on:'+JSON.stringify({...style,request:id}):'ft.off';
  const current={wanted,id,timer:0,signature:style?JSON.stringify(captureValue):''};
  request=current;
  if(new TextEncoder().encode(wire).length>65536||!send(wire)){
    clearRequest();
    notice='칭호 표시 명령을 전송하지 못했습니다.';
    paint();
    return;
  }
  traceFT('on','wanted='+wanted+' session='+session);
  if(request===current)current.timer=setTimeout(()=>{
    clearRequest();
    notice=labels[lastReason]||'칭호 표시 상태 응답이 없습니다.';
    paint();
    send('ft.state');
  },2500);
  paint();
}
function send(value){
  const kind=value.split(':',1)[0];
  try{
    if(typeof window.tullDebugCommand!=='function'){traceFT('send',kind+' no-listener');return false;}
    window.tullDebugCommand(value);
    traceFT('send',kind+' returned');
    return true;
  }catch{traceFT('send',kind+' threw');return false;}
}
function paint(){
  const section=document.querySelector('#titleInternalModal [data-pot-ft-controls]');if(!section)return;
  let host=document.getElementById('pot-ft-minimal-control');
  if(!host){
    host=document.createElement('div');
    host.id='pot-ft-minimal-control';
    const control=document.createElement('button'),status=document.createElement('span');
    control.type='button';
    control.dataset.ftToggle='';
    control.setAttribute('role','switch');
    control.setAttribute('aria-label','캐릭터 주변 칭호 표시');
    control.innerHTML='<span class="pot-ft-track" aria-hidden="true"></span><span>캐릭터 주변 칭호 표시</span>';
    status.dataset.ftStatus='';
    status.setAttribute('role','status');
    host.append(control,status);
    section.append(host);
    control.addEventListener('click',()=>toggle(!enabled));
  }
  const control=host.querySelector('[data-ft-toggle]');
  control.setAttribute('aria-checked',String(enabled));
  control.disabled=!!request;
  host.querySelector('[data-ft-status]').textContent=request?'칭호 표시 상태 응답 대기':notice||
    (!session?'FT 초기 연결 대기':labels[lastReason]||(enabled?(driverBound?'켜짐':'켜짐 · 위치 추적 연결 대기'):'꺼짐'));
}
function color(raw){
  const value=String(raw||'').trim();if(/^#[0-9a-f]{6}$/i.test(value))return value.toUpperCase();
  const short=/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i.exec(value);if(short)return '#'+short.slice(1).map(x=>x+x).join('').toUpperCase();
  const rgb=/^rgba?\(\s*(\d+)[, ]+\s*(\d+)[, ]+\s*(\d+)/i.exec(value);
  if(!rgb)throw Error('title-color');return '#'+rgb.slice(1,4).map(x=>Math.max(0,Math.min(255,Number(x))).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function capture(){
  const owner=window.TULLTitleAuthoringProductionR1,layout=owner?.getCommittedLayout?.();
  const rect=document.getElementById('titleGridSurface')?.getBoundingClientRect();
  const colors=window.TULLFTTitleColors?.(),defaultFont=window.TULLFontManager?.getTitleDefault?.();
  if(!layout||!rect||rect.width<=0||rect.height<=0||!colors||!defaultFont)throw Error('style-owner-unavailable');
  return {defaultFont,fill:color(colors.fill),outline:color(colors.outline),hostWidth:Math.round(rect.width),hostHeight:Math.round(rect.height),
    blocks:Array.from({length:6},(_,i)=>{const id='BLOCK_TITLE_'+String(i+1).padStart(2,'0'),g=layout.geometry[id],p=layout.presentation[id];
      if(!g||!p)throw Error('style-slot');return {slot:i+1,x:g.x,y:g.y,w:g.w,h:g.h,fontId:p.fontId,fontScale:p.fontScale,opacity:p.opacity,rotationDeg:p.rotationDeg,outlineWidth:p.outlineWidth};})};
}
function makeStyle(value=capture()){
  if(styleRevision>=Number.MAX_SAFE_INTEGER)throw Error('style-revision-limit');
  return {session,styleRevision:++styleRevision,...value};
}
function publishNow(){
  if(!enabled||request||!session||importing||window.TULLProfilesA5?.status?.()?.blocked||window.TULLProfilesA5?.uiBusy?.())return;
  try{
    const value=capture(),signature=JSON.stringify(value);
    if(signature===lastSignature)return;
    const wire='ft.style:'+JSON.stringify(makeStyle(value));
    if(new TextEncoder().encode(wire).length<=65536&&send(wire))lastSignature=signature;
  }catch{}
}
function publish(){if(pending)return;pending=true;Promise.resolve().then(()=>{pending=false;paint();publishNow();});}
window.tullFTStatus=raw=>{
  let p;try{p=typeof raw==='string'?JSON.parse(raw):raw;}catch{traceFT('status','invalid-json');return;}
  if(p?.kind!=='ft-status'||!Number.isSafeInteger(p.session)||p.session<=0){traceFT('status','invalid-status');return;}
  if(p.session<session){traceFT('status','stale incoming='+p.session+' current='+session);return;}
  traceFT('status','accepted session='+p.session+' prior='+session+' enabled='+!!p.enabled+' reason='+String(p.reason||'off').slice(0,48));
  if(p.session===session){
    // A pending ON is resolved only by its own terminal response.
    const matchingOn=request?.wanted&&p.request===request.id;
    if(!matchingOn&&(request?.wanted||p.request!==undefined))return;
  }
  clearTimeout(stateTimer);
  if(session!==p.session){session=p.session;styleRevision=0;lastSignature='';notice='';clearRequest();}
  const wasEnabled=enabled;
  enabled=!!p.enabled;driverBound=!!p.driverBound;lastReason=p.reason||'off';
  if(!request&&enabled!==wasEnabled)notice='';
  if(request&&(request.wanted?p.request===request.id:!enabled)){
    const requestSignature=request.signature;
    clearRequest();
    notice='';
    if(enabled){
      lastSignature=requestSignature;
    }
  }
  paint();
  publish();
};
const receive=window.tullReceive;
window.tullReceive=function(raw){
  const result=receive.apply(this,arguments);
  let message;try{message=typeof raw==='string'?JSON.parse(raw):raw;}catch{return result;}
  if(message?.kind==='cpp-ready'){
    const version=document.getElementById('potDllVersion');
    if(version&&/^\d+\.\d+\.\d+$/.test(message.dllVersion||''))version.textContent='DLL v'+message.dllVersion;
    requestState();
    paint();
  }else if(message?.kind==='native-main-reopen'){
    requestState();
  }else if(message?.kind==='title-state'||message?.kind==='title-catalog'){
    publish();
  }
  return result;
};
window.TULLFTMinimalClient=Object.freeze({
 mount:paint,
 publish,
 beginImport(){clearRequest();notice='';importing=true;lastSignature='';paint();},
 endImport(ok){importing=!ok&&!!window.TULLProfilesA5?.status?.().blocked;lastSignature='';send('ft.state');paint();}
});
for(const event of ['change','click','pointerup','keyup'])document.addEventListener(event,publish);
window.addEventListener('tull-fonts-updated',publish);
window.addEventListener('resize',publish);
requestState();paint();
})();
</script>
