<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    pointer-events:none;
    user-select:none;
}
.hudItem{
    position:fixed;
    display:none;
    transform-origin:top left;
    font-family:"Malgun Gothic","Segoe UI Symbol",sans-serif;
    font-weight:700;
    color:rgba(245,245,255,.96);
    text-shadow:
        0 2px 4px rgba(0,0,0,.95),
        0 0 10px rgba(0,0,0,.80);
}
.hudText{
    display:block;
    white-space:nowrap;
}
.hudAsset{
    display:block;
    width:96px;
    height:96px;
    object-fit:contain;
}
.voidCells{
    display:flex;
    align-items:center;
    gap:0;
}
.voidCell{
    display:block;
    position:relative;
    flex:none;
    width:64px;
    height:64px;
}
.voidCell img{
    display:block;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
}
.voidCell .voidFill{z-index:1}
.voidCell .voidFrame{z-index:2}
</style>
</head>
<body>

<div id="hudVoid" class="hudItem">
    <div class="voidCells">
        <span class="voidCell"><img class="voidFill" src="./assets/hud/void_filled.png" alt=""><img class="voidFrame" src="./assets/hud/void_empty.png" alt=""></span>
        <span class="voidCell"><img class="voidFill" src="./assets/hud/void_filled.png" alt=""><img class="voidFrame" src="./assets/hud/void_empty.png" alt=""></span>
        <span class="voidCell"><img class="voidFill" src="./assets/hud/void_filled.png" alt=""><img class="voidFrame" src="./assets/hud/void_empty.png" alt=""></span>
        <span class="voidCell"><img class="voidFill" src="./assets/hud/void_filled.png" alt=""><img class="voidFrame" src="./assets/hud/void_empty.png" alt=""></span>
    </div>
</div>

<div id="hudComposure" class="hudItem">
    <img class="hudAsset" src="./assets/hud/composure.png" alt="">
</div>

<div id="hudQuiet" class="hudItem">
    <img class="hudAsset" src="./assets/hud/quiet_processing.png" alt="">
</div>

<script>
(() => {
    const elements = {
        void:document.getElementById("hudVoid"),
        composure:document.getElementById("hudComposure"),
        quiet:document.getElementById("hudQuiet")
    };

    function clamp(value,min,max) {
        const n = Number(value);
        return Number.isFinite(n) ?
            Math.max(min,Math.min(max,n)) :
            min;
    }

    function hideAll() {
        Object.values(elements).forEach(
            element =>
                element.style.display = "none");
    }

    function applyItem(key,state) {
        const element = elements[key];
        if (!element) return;

        if (!state ||
            !state.visible ||
            !state.active) {
            element.style.display = "none";
            return;
        }

        element.style.left =
            `${clamp(state.x,0,1) * 100}%`;

        element.style.top =
            `${clamp(state.y,0,1) * 100}%`;

        element.style.transform =
            `scale(${clamp(state.scale,.1,5)})`;

        element.style.opacity =
            String(clamp(state.opacity,0,1));

        if (key === "void") {
            const count =
                Math.max(
                    0,
                    Math.min(
                        4,
                        Math.trunc(
                            Number(state.count) || 0)));

            const cells =
                element.querySelectorAll(".voidCell");

            cells.forEach(
                (cell,index) => {
                    const fill = cell.querySelector(".voidFill");
                    if (fill) {
                        fill.style.display =
                            index < count ? "block" : "none";
                    }
                });
        }

        element.style.display = "block";
    }

    window.tullHudReceive =
        function(payload)
        {
            let message = payload;

            try {
                if (typeof payload === "string") {
                    message = JSON.parse(payload);
                }
            }
            catch (_) {
                return;
            }

            if (!message ||
                message.kind !== "hud-overlay") {
                return;
            }

            if (!message.runtimeVisible ||
                !message.masterVisible) {
                hideAll();
                return;
            }

            const items =
                message.items || {
                    void:message.void,
                    composure:message.composure,
                    quiet:message.quiet
                };

            applyItem("void",items.void);
            applyItem("composure",items.composure);
            applyItem("quiet",items.quiet);
        };

    hideAll();
})();
</script>
</body>
</html>
