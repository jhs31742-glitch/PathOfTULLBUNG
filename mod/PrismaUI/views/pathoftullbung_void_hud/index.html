<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    user-select: none;
}

#voidHud {
    position: fixed;
    left: 50%;
    bottom: 18%;
    transform: translateX(-50%);

    display: none;

    font-family:
        "Segoe UI Symbol",
        "Malgun Gothic",
        sans-serif;

    font-size: 44px;
    font-weight: 700;
    line-height: 1;

    letter-spacing: 7px;

    color: rgba(245, 245, 255, 0.96);

    text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.95),
        0 0 10px rgba(0, 0, 0, 0.80);
}
</style>
</head>

<body>

<div id="voidHud">
    ◇◇◇◇
</div>

<script>
window.tullVoidHudReceive =
    function(payload)
    {
        let message =
            payload;

        try {
            if (typeof payload ===
                "string") {

                message =
                    JSON.parse(
                        payload);
            }
        }
        catch (_) {
            return;
        }

        if (!message ||
            message.kind !==
                "void-hud") {

            return;
        }

        const hud =
            document.getElementById(
                "voidHud");

        if (!message.owned) {
            hud.style.display =
                "none";

            return;
        }

        const raw =
            Number(
                message.count);

        const count =
            Number.isFinite(raw) ?
                Math.max(
                    0,
                    Math.min(
                        4,
                        Math.trunc(
                            raw))) :
                0;

        hud.textContent =
            "◆".repeat(count) +
            "◇".repeat(4 - count);

        hud.style.display =
            "block";
    };
</script>

</body>
</html>
